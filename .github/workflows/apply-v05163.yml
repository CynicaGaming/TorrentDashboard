name: Apply v0.5.163 account form refinements

on:
  push:
    branches: [hotfix/signup-confirm-pending-edit-fields]

permissions:
  contents: write

concurrency:
  group: apply-v05163-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[prepared-v05163]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Patch preparation helper
        run: python .github/scripts/patch_v05163_helper.py
      - name: Apply requested refinements
        run: python .github/scripts/apply_v05163.py
      - name: Remove temporary preparation files
        shell: bash
        run: rm -f .github/scripts/apply_v05163.py .github/scripts/patch_v05163_helper.py .github/workflows/apply-v05163.yml
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check "cryptography==50.0.1"
      - name: Regenerate release and handoff documents
        run: python release_tools/generate_release_notes.py --version 0.5.163
      - name: Validate source and browser contracts
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          node --check static/app.js
          node --check static/settings.js
          node --check static/ops.js
      - name: Build source updater package
        shell: bash
        run: |
          python release_tools/build_release.py --repo "${{ github.repository }}" --tag "v0.5.163" --output dist-prep
          test -f "dist-prep/Torrent-Dashboard-0.5.163.zip"
          test -f "dist-prep/Torrent-Dashboard-0.5.163.release.json"
      - name: Check generated documentation and public hygiene
        shell: bash
        run: |
          python release_tools/generate_release_notes.py --version 0.5.163 --check
          python release_tools/validate_public_repo.py
      - name: Commit prepared release
        shell: bash
        run: |
          git config user.name "Cynica"
          git config user.email "47292146+CynicaGaming@users.noreply.github.com"
          git add -A
          git commit -m "Prepare v0.5.163 account form refinements [prepared-v05163]"
          git push origin HEAD:${{ github.ref_name }}
