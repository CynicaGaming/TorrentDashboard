name: Temporary Account Settings Menu Hotfix

on:
  push:
    branches:
      - hotfix/account-settings-menu

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Restore account settings menu visibility
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          app_path = root / 'static/app.js'
          app = app_path.read_text(encoding='utf-8')

          old_bootstrap = "syncCurrentUserUi();$('#accountSettingsBtn')?.classList.toggle('hidden',!!state.me?.is_recovery_account);"
          if old_bootstrap not in app:
              raise SystemExit('recovery account menu hide guard not found')
          app = app.replace(old_bootstrap, 'syncCurrentUserUi();', 1)

          old_sync = "  const editable=!!state.me?.user_id;\n  for(const id of ['accountSettingsBtn']){const el=$('#'+id);if(el)el.disabled=!editable}\n"
          new_sync = """  const editable=!!state.me?.user_id&&!state.me?.is_recovery_account;\n  const accountSettingsBtn=$('#accountSettingsBtn');\n  if(accountSettingsBtn){\n    accountSettingsBtn.disabled=!editable;\n    accountSettingsBtn.title=editable?'':state.me?.is_recovery_account?'The built-in recovery account cannot be edited':'Sign in with a user account to edit account settings';\n  }\n"""
          if old_sync not in app:
              raise SystemExit('account settings editability block not found')
          app = app.replace(old_sync, new_sync, 1)
          app = app.replace("const FRONTEND_BUILD='0.5.153';", "const FRONTEND_BUILD='0.5.154';", 1)
          app_path.write_text(app, encoding='utf-8')

          for relative in ('static/index.html', 'static/sw.js'):
              path = root / relative
              text = path.read_text(encoding='utf-8')
              if '0.5.153' not in text:
                  raise SystemExit(f'{relative}: v0.5.153 marker not found')
              path.write_text(text.replace('0.5.153', '0.5.154'), encoding='utf-8')

          init_path = root / 'src/torrent_dashboard/__init__.py'
          init_text = init_path.read_text(encoding='utf-8')
          if '__version__ = "0.5.153"' not in init_text:
              raise SystemExit('package version marker not found')
          init_path.write_text(init_text.replace('__version__ = "0.5.153"', '__version__ = "0.5.154"', 1), encoding='utf-8')

          validator_path = root / 'release_tools/validate_ui_strings.py'
          validator = validator_path.read_text(encoding='utf-8')
          marker = "    assert \"$('#accountSettingsBtn').addEventListener('click'\" in app_js\n"
          addition = (
              "    assert \"classList.toggle('hidden',!!state.me?.is_recovery_account)\" not in app_js\n"
              "    assert \"accountSettingsBtn.disabled=!editable\" in app_js\n"
              "    assert \"The built-in recovery account cannot be edited\" in app_js\n"
          )
          if marker not in validator:
              raise SystemExit('account settings UI contract marker not found')
          validator_path.write_text(validator.replace(marker, marker + addition, 1), encoding='utf-8')

          releases_path = root / 'release_notes/releases.json'
          releases = json.loads(releases_path.read_text(encoding='utf-8'))
          if any(item.get('version') == '0.5.154' for item in releases.get('releases', [])):
              raise SystemExit('v0.5.154 release metadata already exists')
          releases['releases'].insert(0, {
              'version': '0.5.154',
              'date': '2026-09-11',
              'status': 'prerelease',
              'title': 'Account settings menu visibility hotfix',
              'summary': 'Restores the Account settings entry to the profile menu for recovery-account sessions without making the built-in recovery principal editable.',
              'highlights': [
                  'Keeps Account settings visible in the profile menu for normal users and the built-in recovery account.',
                  'Normal user accounts continue to open the existing self-service profile, password, and avatar modal.',
                  'Recovery-account sessions now show Account settings as disabled with an explicit explanation instead of silently removing it.'
              ],
              'fixes': [
                  'Removes the frontend rule that hid Account settings whenever the active session was the built-in recovery account.',
                  'Preserves the server-side restriction that the built-in recovery principal cannot be edited as a persistent user account.'
              ],
              'technical': [
                  'Moves recovery-account handling into the existing account-menu editability state instead of using hidden visibility state.',
                  'Adds a UI contract that prevents the recovery-account hide guard from being reintroduced.'
              ],
              'validation': [
                  'Runs the full source/unit validation suite, UI contract audit, JavaScript syntax checks, generated release documentation check, public repository hygiene check, and git diff check.'
              ],
              'known_issues': [
                  'Portable backup archives can contain saved client and integration credentials in plaintext; store exported .tdbackup files securely.',
                  'Windows executables are not code-signed yet.'
              ],
              'architecture': [
                  'The built-in recovery account remains non-persistent and non-editable; UI visibility no longer implies editability.'
              ],
              'decisions': [
                  'Keep Account settings discoverable in the profile menu for every authenticated session.',
                  'Do not create a persistent profile or password for the built-in recovery principal.'
              ],
              'next_steps': [
                  {
                      'priority': 1,
                      'title': 'Verify account menu on Windows',
                      'detail': 'Confirm Account settings is visible for normal and recovery sessions, editable for normal accounts, and disabled with explanatory text for the built-in recovery account.'
                  }
              ]
          })
          releases_path.write_text(json.dumps(releases, indent=2) + '\n', encoding='utf-8')

          current_path = root / 'development/current.json'
          current = json.loads(current_path.read_text(encoding='utf-8'))
          current.update({
              'status': 'ready',
              'objective': 'Validate v0.5.154 Account settings profile-menu hotfix on compiled Windows',
              'why': 'The profile menu hid Account settings for the built-in recovery account even though the item should remain discoverable; the hotfix keeps it visible while preserving the non-editable recovery-principal boundary.',
              'acceptance_criteria': [
                  'Source/unit, UI, syntax, generated-documentation, hygiene, source-package, and pull-request matrix checks pass.',
                  'Account settings remains visible in the profile menu for normal and recovery-account sessions.',
                  'Normal user accounts can open and use the existing Account settings modal.',
                  'The built-in recovery account shows Account settings disabled with an explicit explanation and remains non-editable server-side.',
                  'The v0.5.153 Recovery.exe migration and removed in-app Console behavior remain intact.'
              ],
              'decisions': [
                  'Keep Account settings discoverable for every authenticated session.',
                  'Keep the built-in recovery account non-persistent and non-editable.',
                  'Do not reintroduce browser command execution or the removed Recovery Console.'
              ],
              'files': [
                  'static/app.js',
                  'static/index.html',
                  'static/sw.js',
                  'release_tools/validate_ui_strings.py',
                  'src/torrent_dashboard/__init__.py',
                  'release_notes/releases.json'
              ],
              'blockers': [],
              'out_of_scope': [
                  'Making the built-in recovery principal a persistent editable user account, authentication redesign, or reintroducing the browser Recovery Console.'
              ],
              'next_action': 'Install v0.5.154 on compiled Windows and verify profile-menu Account settings behavior for both normal and recovery-account sessions.'
          })
          current_path.write_text(json.dumps(current, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Generate release documentation
        run: python release_tools/generate_release_notes.py --version 0.5.154
      - name: Validate hotfix
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          node --check static/app.js
          node --check static/settings.js
          python release_tools/generate_release_notes.py --version 0.5.154 --check
          python release_tools/validate_public_repo.py
          git diff --check
      - name: Commit validated hotfix
        shell: bash
        run: |
          rm -f .github/workflows/hotfix-account-settings-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.5.154 — Restore Account settings menu entry"
          git push origin HEAD:hotfix/account-settings-menu
