name: Apply Backend Refactor Branch

on:
  push:
    branches:
      - refactor/backend-modularization-users

permissions:
  contents: write

concurrency:
  group: torrent-dashboard-refactor-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply staged refactor
        shell: bash
        run: |
          if [ -f release_tools/apply_feature_update.py ]; then
            python release_tools/apply_feature_update.py
            rm -f release_tools/apply_feature_update.py
          fi

      - name: Validate transformed source
        shell: bash
        run: |
          python -m py_compile dashboard.py updater.py torrent_dashboard/users.py torrent_dashboard/config_store.py release_tools/build_release.py release_tools/generate_release_notes.py
          node --check static/app.js
          node --check static/settings.js
          python - <<'PY'
          import dashboard
          assert dashboard.VERSION in {'0.5.56', '0.5.57', '0.5.58', '0.5.59', '0.5.60', '0.5.61'}
          assert callable(dashboard.normalize_user)
          assert callable(dashboard.save_user)
          assert callable(dashboard.session_is_admin)
          assert dashboard.normalize_user.__module__ == 'torrent_dashboard.users'
          assert callable(dashboard.mutate_config)
          assert hasattr(dashboard, 'CONFIG_STORE')
          if dashboard.VERSION >= '0.5.60':
              assert callable(dashboard.installed_release_info)
          if dashboard.VERSION >= '0.5.61':
              assert callable(dashboard._github_release_integrity)
          PY
          VERSION=$(python - <<'PY'
          import dashboard
          print(dashboard.VERSION)
          PY
          )
          if [ "$VERSION" = "0.5.57" ] || [ "$VERSION" = "0.5.58" ] || [ "$VERSION" = "0.5.59" ] || [ "$VERSION" = "0.5.60" ] || [ "$VERSION" = "0.5.61" ]; then
            python release_tools/generate_release_notes.py --version "$VERSION" --check
          fi

      - name: Commit applied refactor
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply backend modularization increment"
            git push origin HEAD:refactor/backend-modularization-users
          fi
