name: Apply Backend Refactor Branch

on:
  push:
    branches:
      - refactor/backend-modularization-users

permissions:
  contents: write

concurrency:
  group: torrent-dashboard-refactor-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply staged refactor
        shell: bash
        run: |
          if [ -f release_tools/apply_feature_update.py ]; then
            python release_tools/apply_feature_update.py
            rm -f release_tools/apply_feature_update.py
          fi
          if [ -f release_tools/apply_feature_update_post.py ]; then
            python release_tools/apply_feature_update_post.py
            rm -f release_tools/apply_feature_update_post.py
          fi

      - name: Validate transformed source
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          node --check static/app.js
          node --check static/settings.js
          node - <<'JS'
          global.window = {};
          const fs = require('fs');
          eval(fs.readFileSync('static/settings.js','utf8'));
          if (!window.TDSettings || typeof window.TDSettings.bind !== 'function' || typeof window.TDSettings.fill !== 'function') {
            throw new Error('settings.js did not initialize window.TDSettings');
          }
          JS
          VERSION=$(python - <<'PY'
          import dashboard
          print(dashboard.VERSION)
          PY
          )
          python release_tools/generate_release_notes.py --version "$VERSION" --check

      - name: Commit applied refactor
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply backend modularization increment"
            git push origin HEAD:refactor/backend-modularization-users
          fi
