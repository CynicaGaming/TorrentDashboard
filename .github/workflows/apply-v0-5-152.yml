name: Apply v0.5.152 console list parity

on:
  push:
    branches:
      - release/v0.5.152-console-list-parity

permissions:
  contents: write

concurrency:
  group: apply-v0-5-152-console-list-parity
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Apply v0.5.152 changes
        shell: bash
        run: |
          python release_tools/apply_v0_5_152.py
          python release_tools/generate_release_notes.py --version 0.5.152

      - name: Validate release source
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          python release_tools/generate_release_notes.py --version 0.5.152 --check
          python release_tools/validate_public_repo.py

      - name: Build source package
        shell: bash
        run: |
          python release_tools/build_release.py --repo "${{ github.repository }}" --tag v0.5.152 --output dist-test
          test -f dist-test/Torrent-Dashboard-0.5.152.zip
          test -f dist-test/Torrent-Dashboard-0.5.152.release.json
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          path = Path('dist-test/Torrent-Dashboard-0.5.152.zip')
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              prefix = 'Torrent-Dashboard-0.5.152/'
              assert prefix + 'src/torrent_dashboard/dashboard.py' in names
              assert prefix + 'src/torrent_dashboard/recovery_console.py' in names
              assert prefix + 'tests/test_recovery_console_runtime.py' in names
              assert prefix + 'static/index.html' in names
              info = json.loads(z.read(prefix + 'package-info.json'))
              assert info['version'] == '0.5.152'
              assert info['distribution'] == 'source'
              assert info['layout'] == 'src'
          PY
          rm -rf dist-test

      - name: Commit validated release changes
        shell: bash
        run: |
          git config user.name "Cynica"
          git config user.email "47292146+CynicaGaming@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Release v0.5.152 console list parity"
          git push origin HEAD:release/v0.5.152-console-list-parity
