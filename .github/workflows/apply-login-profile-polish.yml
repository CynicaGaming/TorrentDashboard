name: Apply login and profile polish

on:
  push:
    branches:
      - feature/src-package-layout
    paths:
      - .github/workflows/apply-login-profile-polish.yml
      - release_tools/apply_login_profile_polish.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply UI changes
        run: python release_tools/apply_login_profile_polish.py
      - name: Validate source and UI
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          node --check static/app.js
          node --check static/settings.js
          python - <<'PY'
          from pathlib import Path
          html = Path('static/index.html').read_text(encoding='utf-8')
          app_js = Path('static/app.js').read_text(encoding='utf-8')
          assert '.login-card::before{' in html
          assert '@keyframes login-radiant-glow{' in html
          assert 'animation:login-radiant-glow 7s ease-in-out infinite' in html
          assert 'accountConsoleBtn' not in html
          assert 'accountConsoleBtn' not in app_js
          assert 'data-view="console"' in html
          PY
      - name: Commit validated UI changes
        run: |
          git config user.name "Cynica"
          git config user.email "47292146+CynicaGaming@users.noreply.github.com"
          git add static/index.html static/app.js
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
            exit 0
          fi
          git commit -m "Refine login glow and profile menu"
          git push origin HEAD:feature/src-package-layout
