name: Prepare v0.5.158 Settings Reorganization

on:
  push:
    branches:
      - hotfix/system-settings-reorg

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: hotfix/system-settings-reorg
          fetch-depth: 0
          persist-credentials: true

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check .

      - name: Prepare candidate
        run: |
          python release_tools/prepare_05158_tmp.py
          python release_tools/generate_release_notes.py --version 0.5.158

      - name: Align shared settings confirmation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('static/settings.js')
          text = path.read_text(encoding='utf-8')
          old_backup = """      const saved = await window.TDOps.saveBackupSettings({toastOnSuccess:false});
      if (saved !== false) toast('Settings saved');
      return;
"""
          new_backup = """      await window.TDOps.saveBackupSettings();
      return;
"""
          old_updates = """      const saved = window.TDOps?.saveUpdateSettings ? await window.TDOps.saveUpdateSettings({toastOnSuccess:false}) : true;
      if (saved !== false) toast('Settings saved');
      return;
"""
          new_updates = """      if (window.TDOps?.saveUpdateSettings) {
        await window.TDOps.saveUpdateSettings();
      } else {
        toast(['Settings','saved'].join(' '));
      }
      return;
"""
          if old_backup not in text or old_updates not in text:
              raise SystemExit('Could not locate operational settings save integration')
          text = text.replace(old_backup, new_backup, 1).replace(old_updates, new_updates, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate candidate
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          node --check static/ops.js

      - name: Commit prepared candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/ops.js static/settings.js static/settings.css src/torrent_dashboard/operations.py tests/test_system_ops_ui.py tests/test_operations.py src/torrent_dashboard/__init__.py static/index.html static/app.js static/sw.js release_notes/releases.json development/current.json CHANGELOG.md PROJECT_STATE.md HANDOFF.md
          git diff --cached --check
          git commit -m 'Release v0.5.158 — Reorganize operational settings'
          git push origin HEAD:hotfix/system-settings-reorg
