name: Prepare v0.5.155 release candidate

on:
  push:
    branches:
      - ops-suite-v0555

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Prepare version and generated release documentation
        run: python release_tools/prepare_v0555.py
      - name: Commit generated release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/torrent_dashboard/__init__.py \
            static/index.html static/app.js static/sw.js \
            release_notes/releases.json development/current.json \
            CHANGELOG.md PROJECT_STATE.md HANDOFF.md
          if git diff --cached --quiet; then
            echo "Release candidate already prepared"
            exit 0
          fi
          git commit -m "Prepare v0.5.155 release candidate"
          git push origin HEAD:ops-suite-v0555
