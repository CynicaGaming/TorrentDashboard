name: Fix v0.5.163 registration confirmation order

on:
  push:
    branches: [hotfix/signup-confirm-pending-edit-fields]

permissions:
  contents: write

concurrency:
  group: fix-v05163-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[fixed-v05163-order]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Fix registration validation order
        run: python .github/scripts/fix_v05163_registration_order.py
      - name: Remove temporary fix machinery
        shell: bash
        run: rm -f .github/scripts/fix_v05163_registration_order.py .github/workflows/fix-v05163-registration-order.yml
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check "cryptography==50.0.1"
      - name: Validate source and browser contracts
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          node --check static/app.js
          node --check static/settings.js
          node --check static/ops.js
          python release_tools/generate_release_notes.py --version 0.5.163 --check
          python release_tools/validate_public_repo.py
      - name: Build source updater package outside the repository
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/dist-v05163"
          python release_tools/build_release.py --repo "${{ github.repository }}" --tag "v0.5.163" --output "$OUT"
          test -f "$OUT/Torrent-Dashboard-0.5.163.zip"
          test -f "$OUT/Torrent-Dashboard-0.5.163.release.json"
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Cynica"
          git config user.email "47292146+CynicaGaming@users.noreply.github.com"
          git add -A
          git commit -m "Fix v0.5.163 registration validation order [fixed-v05163-order]"
          git push origin HEAD:${{ github.ref_name }}
