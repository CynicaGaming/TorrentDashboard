name: Apply v0.5.162 user-flow refinements

on:
  push:
    branches: [feature/unify-pending-users-signup-label]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/unify-pending-users-signup-label
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Apply requested refinements
        run: python .github/scripts/apply_v05162.py
      - name: Remove temporary preparation files
        shell: bash
        run: |
          rm .github/scripts/apply_v05162.py
          rm .github/workflows/apply-v05162.yml
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check .
      - name: Regenerate release and handoff documents
        run: python release_tools/generate_release_notes.py --version 0.5.162
      - name: Validate source and browser contracts
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          node --check static/app.js
          node --check static/settings.js
          node --check static/ops.js
      - name: Build source updater package
        shell: bash
        run: |
          python release_tools/build_release.py --repo "${{ github.repository }}" --tag v0.5.162 --output dist-prep
          test -f dist-prep/Torrent-Dashboard-0.5.162.zip
          test -f dist-prep/Torrent-Dashboard-0.5.162.release.json
          rm -rf dist-prep
      - name: Check generated documentation and public hygiene
        shell: bash
        run: |
          python release_tools/generate_release_notes.py --version 0.5.162 --check
          python release_tools/validate_public_repo.py
      - name: Commit prepared release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.5.162 — Unify Pending user management"
          git push origin HEAD:feature/unify-pending-users-signup-label
