name: Prepare v0.5.160 Registration Approval

on:
  push:
    branches:
      - feature/user-registration-approval-impl

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/user-registration-approval-impl
          fetch-depth: 0
          persist-credentials: true

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check .

      - name: Prepare candidate
        run: |
          python release_tools/prepare_05160_tmp.py
          python release_tools/generate_release_notes.py --version 0.5.160

      - name: Validate candidate
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js

      - name: Commit prepared candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/torrent_dashboard/users.py src/torrent_dashboard/dashboard.py static/index.html static/app.js static/settings.js static/settings.css tests/test_user_registration.py tests/test_registration_ui.py release_tools/validate_ui_strings.py src/torrent_dashboard/__init__.py static/sw.js release_notes/releases.json development/current.json CHANGELOG.md PROJECT_STATE.md HANDOFF.md
          git diff --cached --check
          git commit -m 'Release v0.5.160 — Add registration approval flow'
          git push origin HEAD:feature/user-registration-approval-impl
