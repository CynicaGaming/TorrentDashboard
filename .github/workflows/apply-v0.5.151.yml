name: Apply v0.5.151 profile and backup polish

on:
  push:
    branches:
      - release/v0.5.151-profile-backup-polish

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply v0.5.151 changes
        shell: bash
        run: |
          python release_tools/apply_v0_5_151.py
          python release_tools/generate_release_notes.py --version 0.5.151
      - name: Validate release source
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          python release_tools/validate_public_repo.py
          python release_tools/build_release.py --repo "${{ github.repository }}" --tag v0.5.151 --output dist-test
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          path = Path('dist-test/Torrent-Dashboard-0.5.151.zip')
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              info = json.loads(z.read('Torrent-Dashboard-0.5.151/package-info.json'))
              assert info['version'] == '0.5.151'
              assert info['distribution'] == 'source'
              assert 'Torrent-Dashboard-0.5.151/src/torrent_dashboard/backups.py' in names
              assert 'Torrent-Dashboard-0.5.151/static/index.html' in names
          PY
      - name: Commit validated release changes
        shell: bash
        run: |
          git config user.name "Cynica"
          git config user.email "47292146+CynicaGaming@users.noreply.github.com"
          git add -A
          git reset .github/workflows/apply-v0.5.151.yml release_tools/apply_v0_5_151.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "v0.5.151 profile and backup lifecycle polish"
          git push origin HEAD:release/v0.5.151-profile-backup-polish
