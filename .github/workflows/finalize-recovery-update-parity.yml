name: Temporary Recovery Update Parity

on:
  push:
    branches:
      - remove-in-app-console
    paths:
      - .github/workflows/finalize-recovery-update-parity.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Migrate staged update commands into Recovery.exe
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          path = root / 'src/torrent_dashboard/recovery_tool.py'
          text = path.read_text(encoding='utf-8')

          import_marker = '''from torrent_dashboard.recovery_operations import (\n    SAFE_TORRENT_ACTIONS,\n    history_events,\n    jellyfin_task_action,\n    list_clients,\n    list_integrations,\n    list_jellyfin_tasks,\n    list_torrents,\n    list_users,\n    redacted_configuration,\n    test_client,\n    test_integration,\n    torrent_action,\n)\n'''
          import_replacement = import_marker + '''from torrent_dashboard.recovery_update_staging import read_staged_update, stage_latest_update\n'''
          if import_marker not in text:
              raise SystemExit('recovery operations import block not found')
          text = text.replace(import_marker, import_replacement, 1)

          function_marker = '''def network_reset(cfg: dict) -> None:\n'''
          functions = '''def stage_update_download(cfg: dict) -> dict:\n    upd = updater_module()\n    state = stage_latest_update(APP_DIR, configured_repository(cfg), upd)\n    if state.get("state") == "upToDate":\n        print(f"Torrent Dashboard {state.get('currentVersion') or current_version()} is already current.")\n    else:\n        print(f"Verified update {state.get('version')} downloaded and retained for installation.")\n        print(f"Package: {state.get('package')}")\n    return state\n\n\ndef install_staged_update(requested_version: str | None = None) -> None:\n    upd = updater_module()\n    if upd.dashboard_instance_running():\n        raise RuntimeError("Stop Torrent Dashboard before installing a staged update from local recovery")\n    state = read_staged_update(APP_DIR, upd, requested_version)\n    command = updater_command(APP_DIR, detached=True)\n    command += [\n        "--pid", str(os.getpid()),\n        "--source", state["source"],\n        "--target", str(APP_DIR),\n        "--version", state["version"],\n    ]\n    kwargs = {\n        "cwd": str(APP_DIR),\n        "stdin": subprocess.DEVNULL,\n        "stdout": None,\n        "stderr": None,\n        "env": source_python_env(APP_DIR),\n    }\n    if os.name == "nt":\n        kwargs["creationflags"] = getattr(subprocess, "CREATE_NEW_PROCESS_GROUP", 0)\n    subprocess.Popen(command, **kwargs)\n    print(f"Installing verified staged update {state['version']}. Recovery will close so managed files can be replaced safely.")\n    raise SystemExit(0)\n\n\n'''
          if function_marker not in text:
              raise SystemExit('network_reset marker not found')
          text = text.replace(function_marker, functions + function_marker, 1)

          old_help = '''  update status                               Show local update state\n  update check                                Check for a release\n  update repo [owner/repository|default]      Show or change the update repository\n  update install|apply                        Download, verify, and install the latest release\n  update reinstall                            Reinstall the latest verified release\n  update clear                                Clear stuck staged update files/status\n'''
          new_help = '''  update status                               Show local update state\n  update check                                Check for a release\n  update repo [owner/repository|default]      Show or change the update repository\n  update download                             Download, verify, and retain the latest update\n  update install [version]                    Install the retained verified update\n  update apply                                Download, verify, and install the latest update\n  update reinstall                            Reinstall the latest release directly from GitHub\n  update clear                                Clear stuck staged update files/status\n'''
          if old_help not in text:
              raise SystemExit('update help block not found')
          text = text.replace(old_help, new_help, 1)

          old_dispatch = '''        elif sub in ("install", "apply", "reinstall") and len(parts) == 2:\n            force = sub == "reinstall"\n            action = "reinstall" if force else "install"\n            if not confirm(f"This will {action} Torrent Dashboard from {configured_repository(cfg)}."):\n                print("Cancelled.")\n            else:\n                install_update(cfg, force=force)\n        elif sub == "download" and len(parts) == 2:\n            raise RuntimeError("Recovery.exe does not keep a separate staged download; use update install to download, verify, and apply in one operation")\n        elif sub == "clear" and len(parts) == 2:\n'''
          new_dispatch = '''        elif sub == "download" and len(parts) == 2:\n            stage_update_download(cfg)\n        elif sub == "install" and len(parts) in (2, 3):\n            requested_version = parts[2] if len(parts) == 3 else None\n            label = f" {requested_version}" if requested_version else ""\n            if not confirm(f"Install the retained verified update{label}?"):\n                print("Cancelled.")\n            else:\n                install_staged_update(requested_version)\n        elif sub == "apply" and len(parts) == 2:\n            if not confirm(f"Download, verify, and install the latest Torrent Dashboard release from {configured_repository(cfg)}?"):\n                print("Cancelled.")\n            else:\n                staged = stage_update_download(cfg)\n                if staged.get("state") != "upToDate":\n                    install_staged_update(str(staged.get("version") or ""))\n        elif sub == "reinstall" and len(parts) == 2:\n            if not confirm(f"Reinstall Torrent Dashboard from {configured_repository(cfg)}?"):\n                print("Cancelled.")\n            else:\n                install_update(cfg, force=True)\n        elif sub == "clear" and len(parts) == 2:\n'''
          if old_dispatch not in text:
              raise SystemExit('old update dispatcher not found')
          text = text.replace(old_dispatch, new_dispatch, 1)
          text = text.replace(
              'raise RuntimeError("Usage: update status|check|repo|install|apply|reinstall|clear")',
              'raise RuntimeError("Usage: update status|check|repo|download|install [version]|apply|reinstall|clear")',
              1,
          )
          path.write_text(text, encoding='utf-8')

          releases_path = root / 'release_notes/releases.json'
          releases = json.loads(releases_path.read_text(encoding='utf-8'))
          entry = next(item for item in releases['releases'] if item.get('version') == '0.5.153')
          entry['technical'] = [
              'Adds recovery_operations.py as a dashboard-independent local operations boundary with direct qBittorrent authentication, client testing, live torrent listing, and a start/stop/recheck/reannounce allowlist.',
              'Deletes recovery_console.py and its dashboard runtime cache coupling; Recovery.exe remains a non-listening process and does not import the dashboard composition root.',
              'Preserves the former Console update download/install split through recovery_update_staging.py: Recovery.exe can retain a SHA-256-verified package, revalidate the retained package before install, or download-and-apply in one operation.'
          ]
          entry['validation'].append('Adds staged-update coverage for retained package verification, up-to-date behavior, digest failures, tamper rechecks, and requested-version matching.')
          releases_path.write_text(json.dumps(releases, indent=2) + '\n', encoding='utf-8')

          current_path = root / 'development/current.json'
          current = json.loads(current_path.read_text(encoding='utf-8'))
          if 'src/torrent_dashboard/recovery_update_staging.py' not in current['files']:
              current['files'].append('src/torrent_dashboard/recovery_update_staging.py')
          current['acceptance_criteria'].insert(3, 'Recovery.exe preserves staged update download/install behavior: update download retains a verified package, update install consumes only a revalidated stage, and update apply performs both steps.')
          current_path.write_text(json.dumps(current, indent=2) + '\n', encoding='utf-8')

          architecture_path = root / 'ARCHITECTURE.md'
          architecture = architecture_path.read_text(encoding='utf-8')
          needle = 'Neither module imports the dashboard composition root or starts a listening server.\n'
          replacement = needle + '\n`recovery_update_staging.py` owns the retained-package boundary for local recovery updates. It downloads only GitHub release assets with SHA-256 metadata, validates the extracted distribution/version, records a `readyToInstall` state under `data/updates/`, and rehashes the retained ZIP before handing the extracted source to the standalone updater.\n'
          if needle not in architecture:
              raise SystemExit('architecture recovery boundary not found')
          architecture_path.write_text(architecture.replace(needle, replacement, 1), encoding='utf-8')

          testing_path = root / 'TESTING.md'
          testing = testing_path.read_text(encoding='utf-8')
          needle = '- Recovery torrent mutations accept only start, stop, recheck, and reannounce; destructive torrent deletion is rejected.\n'
          addition = '- Recovery update download retains a verified package without installing it; update install revalidates that retained package before replacement, and update apply performs both steps.\n'
          if needle not in testing:
              raise SystemExit('testing recovery marker not found')
          testing_path.write_text(testing.replace(needle, needle + addition, 1), encoding='utf-8')
          PY
      - name: Regenerate release documentation
        run: python release_tools/generate_release_notes.py --version 0.5.153
      - name: Validate final source
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          node --check static/app.js
          node --check static/settings.js
          python release_tools/generate_release_notes.py --version 0.5.153 --check
          python release_tools/validate_public_repo.py
          git diff --check
      - name: Commit final parity changes
        shell: bash
        run: |
          rm -f .github/workflows/finalize-recovery-update-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve staged update commands in Recovery.exe"
          git push origin HEAD:remove-in-app-console
