name: Publish Refactor Pre-Release

on:
  push:
    branches:
      - prerelease/backend-modularization

permissions:
  contents: write

concurrency:
  group: torrent-dashboard-refactor-prerelease
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate Refactored Source
        shell: bash
        run: |
          python -m py_compile dashboard.py updater.py release_tools/build_release.py release_tools/generate_release_notes.py torrent_dashboard/users.py torrent_dashboard/config_store.py
          node --check static/app.js
          node --check static/settings.js
          python - <<'PY'
          import json
          import dashboard
          import torrent_dashboard.users as users

          assert dashboard.VERSION >= '0.5.55'
          assert dashboard.normalize_user is users.normalize_user
          assert dashboard.save_user is users.save_user
          assert dashboard.session_is_admin is users.session_is_admin
          assert callable(dashboard.normalize_qbittorrent_server)
          assert callable(dashboard.normalize_integration)
          assert callable(dashboard.mutate_config)
          assert hasattr(dashboard, 'CONFIG_STORE')
          if dashboard.VERSION >= '0.5.58':
              assert callable(dashboard.local_release_history)
              history = dashboard.local_release_history()
              if dashboard.VERSION >= '0.5.59':
                  assert len(history) == 2
                  metadata = json.load(open('release_notes/releases.json', encoding='utf-8'))
                  assert len(metadata.get('releases', [])) >= 5
              else:
                  assert len(history) >= 4
          if dashboard.VERSION >= '0.5.60':
              assert callable(dashboard.installed_release_info)
          PY

      - name: Determine Version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          text=open('dashboard.py', encoding='utf-8').read()
          print(re.search(r'^VERSION\s*=\s*["\']([^"\']+)', text, re.M).group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        shell: bash
        run: |
          python release_tools/generate_release_notes.py \
            --version "${{ steps.version.outputs.version }}" \
            --release-body dist/release-notes.md \
            --check

      - name: Replace Existing Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true

      - name: Build Release Package
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          python release_tools/build_release.py --repo "$REPO" --tag "$TAG" --output dist
          ZIP="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.zip"
          INFO="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.release.json"
          test -f "$ZIP"
          test -f "$INFO"
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          version='${{ steps.version.outputs.version }}'
          path=Path('dist') / f'Torrent-Dashboard-{version}.zip'
          info_path=Path('dist') / f'Torrent-Dashboard-{version}.release.json'
          with zipfile.ZipFile(path) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
          assert any(n.endswith('/dashboard.py') for n in names)
          assert any(n.endswith('/torrent_dashboard/__init__.py') for n in names)
          assert any(n.endswith('/torrent_dashboard/users.py') for n in names)
          assert any(n.endswith('/torrent_dashboard/config_store.py') for n in names)
          assert any(n.endswith('/PROJECT_STATE.md') for n in names)
          assert any(n.endswith('/CHANGELOG.md') for n in names)
          assert any(n.endswith('/release_notes/releases.json') for n in names)
          assert any(n.endswith('/updater.py') for n in names)
          assert not any(n.endswith('apply_feature_update.py') for n in names)
          info=json.loads(info_path.read_text(encoding='utf-8'))
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          assert info['version'] == version
          assert info['package'] == path.name
          assert info['sha256'] == digest
          PY

      - name: Publish GitHub Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          ZIP="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.zip"
          INFO="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.release.json"
          gh release create "$TAG" \
            "$ZIP" "$INFO" \
            --target "$GITHUB_SHA" \
            --title "Torrent Dashboard $TAG Pre-Release" \
            --notes-file dist/release-notes.md \
            --prerelease
