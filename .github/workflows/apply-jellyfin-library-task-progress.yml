name: Apply Jellyfin library task progress

on:
  push:
    branches:
      - feature/jellyfin-library-task-progress

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply task-progress update
        run: python release_tools/apply_jellyfin_library_task_progress.py
      - name: Validate
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          python release_tools/generate_release_notes.py --version 0.5.133 --check
          grep -q 'RefreshMediaLibraryTask' torrent_dashboard/jellyfin.py
          grep -q 'CurrentProgressPercentage' torrent_dashboard/jellyfin.py
          grep -q 'isJellyfinLibraryScanTask' static/settings.js
          ! grep -q 'scheduleJellyfinLibraryPoll' static/settings.js
          grep -q 'VERSION = "0.5.133"' dashboard.py
      - name: Commit validated source
        shell: bash
        run: |
          rm -f release_tools/apply_jellyfin_library_task_progress.py .github/workflows/apply-jellyfin-library-task-progress.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use Jellyfin scan task progress'
          git push origin HEAD:feature/jellyfin-library-task-progress
