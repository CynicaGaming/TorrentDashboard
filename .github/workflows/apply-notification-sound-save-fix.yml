name: Apply notification sound save fix

on:
  push:
    branches:
      - feature/notification-sound-save-fix

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply fixes
        run: python release_tools/apply_notification_sound_save_fix.py

      - name: Validate
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          python release_tools/generate_release_notes.py --version 0.5.127 --check
          grep -q 'notification-sound-select-button' static/index.html
          grep -q 'filename = _multipart_disposition_param(disposition, "filename")' dashboard.py

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix notification sound save and selector'
          git push
