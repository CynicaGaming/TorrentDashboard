name: Apply Jellyfin refresh icons

on:
  push:
    branches:
      - feature/jellyfin-refresh-icons

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply refresh icon update
        run: python release_tools/apply_jellyfin_refresh_icons.py

      - name: Validate
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          python release_tools/generate_release_notes.py --version 0.5.130 --check
          grep -q 'aria-label="Refresh Jellyfin status"' static/settings.js
          grep -q 'aria-label="Refresh Jellyfin libraries"' static/settings.js
          ! grep -q '>Reload status</button>' static/settings.js
          ! grep -q '>Refresh libraries</button>' static/settings.js

      - name: Commit validated source
        shell: bash
        run: |
          rm -f release_tools/apply_jellyfin_refresh_icons.py .github/workflows/apply-jellyfin-refresh-icons.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Use inline Jellyfin refresh icons'
          git push
