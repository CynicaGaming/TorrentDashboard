name: Temporary Recovery Console Migration

# Branch-only one-shot migration; remove after the migration commit is produced.
on:
  push:
    branches:
      - remove-in-app-console
    paths:
      - .github/workflows/migrate-recovery-console.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Correct literal replacement handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('release_tools/migrate_recovery_console.py')
          text = path.read_text(encoding='utf-8')
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)'
          if old not in text:
              raise SystemExit('migration replacement helper was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply migration
        run: python release_tools/migrate_recovery_console.py
      - name: Synchronize service-worker cache namespace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('static/sw.js')
          text = path.read_text(encoding='utf-8')
          old = 'torrent-dashboard-v05152'
          new = 'torrent-dashboard-v05153'
          if old not in text:
              raise SystemExit('old service-worker cache namespace was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Generate release documentation
        run: python release_tools/generate_release_notes.py --version 0.5.153
      - name: Validate migrated source
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          node --check static/app.js
          node --check static/settings.js
          python release_tools/generate_release_notes.py --version 0.5.153 --check
          python release_tools/validate_public_repo.py
          git diff --check
      - name: Commit migration result
        shell: bash
        run: |
          rm -f release_tools/migrate_recovery_console.py .github/workflows/migrate-recovery-console.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.5.153 — Move console operations to local recovery"
          git push origin HEAD:remove-in-app-console
