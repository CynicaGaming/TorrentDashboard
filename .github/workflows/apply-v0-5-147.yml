name: Apply v0.5.147 console and login polish

on:
  push:
    branches:
      - feature/src-package-layout

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply v0.5.147 changes
        shell: bash
        run: |
          python release_tools/apply_v0_5_147.py
          python release_tools/generate_release_notes.py --version 0.5.147
      - name: Validate source and console behavior
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          python release_tools/build_release.py --repo "${{ github.repository }}" --tag v0.5.147 --output dist-test
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "Cynica"
          git config user.email "47292146+CynicaGaming@users.noreply.github.com"
          git add -A
          git reset .github/workflows/apply-v0-5-147.yml release_tools/apply_v0_5_147.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Add console list parity and refine login glow"
          git push origin HEAD:feature/src-package-layout
