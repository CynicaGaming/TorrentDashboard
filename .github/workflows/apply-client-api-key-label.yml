name: Apply client API key label cleanup

on:
  push:
    branches:
      - feature/client-api-key-label

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply label cleanup
        run: python release_tools/apply_client_api_key_label.py

      - name: Validate
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          python release_tools/generate_release_notes.py --version 0.5.128 --check
          grep -q 'API key (qBitTorrent 5.2+)' static/app.js
          ! grep -q 'qBitTorrent 5.2+ · Bearer authentication' static/app.js

      - name: Commit validated source
        shell: bash
        run: |
          rm -f release_tools/apply_client_api_key_label.py .github/workflows/apply-client-api-key-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Simplify qBitTorrent API key labeling'
          git push
