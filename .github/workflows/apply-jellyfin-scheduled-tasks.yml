name: Apply Jellyfin scheduled task feature

on:
  push:
    branches:
      - feature/jellyfin-scheduled-tasks

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply feature
        shell: bash
        run: |
          python release_tools/apply_jellyfin_scheduled_tasks.py
          python release_tools/generate_release_notes.py --version 0.5.124

      - name: Validate
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm release_tools/apply_jellyfin_scheduled_tasks.py
          git add -A
          git commit -m 'Add Jellyfin scheduled task controls [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}

# Follow-up commit intentionally triggers this workflow after registration.
