name: Apply Jellyfin scheduled task feature

on:
  push:
    branches:
      - feature/jellyfin-scheduled-tasks

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply scheduled task feature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          VERSION_OLD = '0.5.123'
          VERSION_NEW = '0.5.124'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          path = 'torrent_dashboard/jellyfin.py'
          text = read(path)
          text = replace_once(text, '"""Jellyfin service-integration runtime for status, libraries, and explicit refresh actions."""', '"""Jellyfin service-integration runtime for status, libraries, scheduled tasks, and explicit actions."""', 'jellyfin docstring')
          text = replace_once(text, 'import json\nimport urllib.error\nimport urllib.request\n', 'import json\nimport urllib.error\nimport urllib.parse\nimport urllib.request\n', 'jellyfin imports')
          marker = '\ndef jellyfin_overview(item, *, opener=None):\n'
          if marker not in text:
              raise RuntimeError('jellyfin overview marker not found')
          task_helpers = r'''

def _normalized_task_progress(value):
    try:
        progress = float(value) if value is not None else None
    except (TypeError, ValueError):
        return None
    if progress is None:
        return None
    return max(0.0, min(100.0, progress))


def _normalized_scheduled_task(source):
    if not isinstance(source, dict):
        return None
    task_id = str(source.get("Id") or "").strip()
    if not task_id:
        return None
    result = source.get("LastExecutionResult") if isinstance(source.get("LastExecutionResult"), dict) else {}
    state = str(source.get("State") or "Idle").strip() or "Idle"
    return {
        "id": task_id,
        "key": str(source.get("Key") or "").strip(),
        "name": str(source.get("Name") or "Scheduled task").strip(),
        "description": str(source.get("Description") or "").strip(),
        "category": str(source.get("Category") or "Other").strip() or "Other",
        "state": state,
        "running": state.lower() in ("running", "cancelling"),
        "progress": _normalized_task_progress(source.get("CurrentProgressPercentage")),
        "last_status": str(result.get("Status") or "").strip(),
        "last_start": str(result.get("StartTimeUtc") or "").strip(),
        "last_end": str(result.get("EndTimeUtc") or "").strip(),
        "last_error": str(result.get("ErrorMessage") or "").strip(),
    }


def jellyfin_scheduled_tasks(item, *, opener=None):
    """Return all non-hidden Jellyfin scheduled tasks, including plugin tasks."""
    data = _jellyfin_request(item, "/ScheduledTasks?isHidden=false", opener=opener)
    if not isinstance(data, list):
        raise RuntimeError("Jellyfin returned an invalid scheduled-task response")
    tasks = []
    for source in data:
        task = _normalized_scheduled_task(source)
        if task:
            tasks.append(task)
    tasks.sort(key=lambda task: (task["category"].lower(), task["name"].lower()))
    return tasks


def _scheduled_task_endpoint(task_id):
    task_id = str(task_id or "").strip()
    if not task_id:
        raise RuntimeError("Jellyfin scheduled task ID is required")
    return "/ScheduledTasks/Running/" + urllib.parse.quote(task_id, safe="")


def start_jellyfin_scheduled_task(item, task_id, *, opener=None):
    """Start one Jellyfin scheduled task by ID."""
    _jellyfin_request(item, _scheduled_task_endpoint(task_id), method="POST", expect_json=False, opener=opener)
    return {"ok": True, "message": "Jellyfin scheduled task started"}


def stop_jellyfin_scheduled_task(item, task_id, *, opener=None):
    """Stop one running Jellyfin scheduled task by ID."""
    _jellyfin_request(item, _scheduled_task_endpoint(task_id), method="DELETE", expect_json=False, opener=opener)
    return {"ok": True, "message": "Jellyfin scheduled task stop requested"}
'''
          text = text.replace(marker, task_helpers + marker, 1)
          text = replace_once(text, '    "jellyfin_overview",\n    "jellyfin_server_info",\n    "refresh_jellyfin_libraries",\n', '    "jellyfin_overview",\n    "jellyfin_scheduled_tasks",\n    "jellyfin_server_info",\n    "refresh_jellyfin_libraries",\n    "start_jellyfin_scheduled_task",\n    "stop_jellyfin_scheduled_task",\n', 'jellyfin exports')
          write(path, text)

          path = 'dashboard.py'
          text = read(path)
          text = replace_once(text, 'from torrent_dashboard.jellyfin import (\n    find_jellyfin_integration,\n    jellyfin_overview,\n    refresh_jellyfin_libraries,\n)', 'from torrent_dashboard.jellyfin import (\n    find_jellyfin_integration,\n    jellyfin_overview,\n    jellyfin_scheduled_tasks,\n    refresh_jellyfin_libraries,\n    start_jellyfin_scheduled_task,\n    stop_jellyfin_scheduled_task,\n)', 'dashboard jellyfin imports')
          text = replace_once(text, '"/api/integrations/jellyfin/status","/api/users"', '"/api/integrations/jellyfin/status","/api/integrations/jellyfin/tasks","/api/users"', 'dashboard admin route list')
          status_block = '''        if path=="/api/integrations/jellyfin/status":\n            try:\n                item=find_jellyfin_integration(cfg,qs.get("id",[""])[0])\n                return self.send_json(200,jellyfin_overview(item),new_cookie)\n            except Exception as e:\n                return self.send_json(502,{"error":str(e)},new_cookie)\n'''
          tasks_block = status_block + '''        if path=="/api/integrations/jellyfin/tasks":\n            try:\n                item=find_jellyfin_integration(cfg,qs.get("id",[""])[0])\n                return self.send_json(200,{"tasks":jellyfin_scheduled_tasks(item)},new_cookie)\n            except Exception as e:\n                return self.send_json(502,{"error":str(e)},new_cookie)\n'''
          text = replace_once(text, status_block, tasks_block, 'dashboard Jellyfin task GET route')
          refresh_block = '''            if path=="/api/integrations/jellyfin/refresh":\n                data=parse_json_body(self,10000); item=find_jellyfin_integration(cfg,data.get("id"))\n                try:\n                    result=refresh_jellyfin_libraries(item)\n                except Exception as exc:\n                    HISTORY.event("dashboard","jellyfin_library_refresh_failed",item.get("name","Jellyfin"),"",{"client_ip":self.client_ip(),"integration_id":item.get("id","")})\n                    return self.send_json(502,{"error":str(exc)},new_cookie)\n                HISTORY.event("dashboard","jellyfin_library_refresh_requested",item.get("name","Jellyfin"),"",{"client_ip":self.client_ip(),"integration_id":item.get("id","")})\n                return self.send_json(200,result,new_cookie)\n'''
          task_post = refresh_block + '''            if path=="/api/integrations/jellyfin/task":\n                data=parse_json_body(self,10000); item=find_jellyfin_integration(cfg,data.get("id")); task_id=str(data.get("task_id") or "").strip(); action=str(data.get("action") or "start").strip().lower()\n                if not task_id:\n                    raise RuntimeError("Jellyfin scheduled task ID is required")\n                if action=="start":\n                    result=start_jellyfin_scheduled_task(item,task_id)\n                elif action=="stop":\n                    result=stop_jellyfin_scheduled_task(item,task_id)\n                else:\n                    raise RuntimeError("Jellyfin scheduled task action must be start or stop")\n                HISTORY.event("dashboard",f"jellyfin_scheduled_task_{action}",task_id,"",{"client_ip":self.client_ip(),"integration_id":item.get("id","")})\n                return self.send_json(200,result,new_cookie)\n'''
          text = replace_once(text, refresh_block, task_post, 'dashboard Jellyfin task POST route')
          text = replace_once(text, f'VERSION = "{VERSION_OLD}"', f'VERSION = "{VERSION_NEW}"', 'dashboard version')
          write(path, text)

          path = 'static/settings.js'
          text = read(path)
          start = text.index('  function jellyfinServiceMarkup(item) {')
          end = text.index('  function renderIntegrations() {', start)
          new_segment = r'''  function jellyfinTaskIcon(name) {
    const paths={chevron:'M9.29 6.71a.996.996 0 0 0 0 1.41L13.17 12l-3.88 3.88a.996.996 0 1 0 1.41 1.41l4.59-4.59a.996.996 0 0 0 0-1.41L10.7 6.7a.996.996 0 0 0-1.41.01Z',play:'M8 5v14l11-7z',stop:'M6 6h12v12H6z',schedule:'M11.99 2C6.48 2 2 6.48 2 12s4.48 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2Zm.01 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7Z'};
    return `<svg class="material-symbol-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[name]||paths.schedule}"/></svg>`;
  }

  function jellyfinServiceMarkup(item) {
    if (item.type !== 'jellyfin' || !item.id || item._new) return '';
    return `<section class="integration-service jellyfin-service" data-jellyfin-service><div class="integration-service-head"><div class="integration-service-heading"><span class="eyebrow">Jellyfin server</span><div class="jellyfin-server-line"><span class="service-status-badge checking" data-jellyfin-status>Checking…</span><strong data-jellyfin-name>Jellyfin</strong></div><small data-jellyfin-meta>Loading server status…</small></div><button class="secondary jellyfin-reload" type="button">Reload status</button></div><div class="jellyfin-library-head"><div><strong>Libraries</strong><small data-jellyfin-library-count>Loading…</small></div><button class="secondary jellyfin-refresh-libraries" type="button">Refresh libraries</button></div><div class="jellyfin-library-list" data-jellyfin-libraries><div class="integration-service-empty">Loading libraries…</div></div><section class="jellyfin-task-section"><button class="jellyfin-task-summary" type="button" aria-expanded="false"><span class="jellyfin-task-summary-main"><span class="jellyfin-task-chevron">${jellyfinTaskIcon('chevron')}</span><span><strong>Scheduled tasks</strong><small data-jellyfin-task-count>Loading…</small></span></span></button><div class="jellyfin-task-body hidden" data-jellyfin-task-body><div class="jellyfin-task-list" data-jellyfin-tasks><div class="integration-service-empty">Loading scheduled tasks…</div></div></div></section></section>`;
  }

  function jellyfinLibraryType(value='') {
    const raw=String(value||'').toLowerCase();
    const labels={movies:'Movies',tvshows:'TV shows',music:'Music',books:'Books',photos:'Photos',musicvideos:'Music videos',homevideos:'Home videos',boxsets:'Collections',mixed:'Mixed content'};
    return labels[raw] || (raw ? uiText(raw) : 'Library');
  }

  function renderJellyfinOverview(card, data) {
    const server=data?.server||{}, libraries=Array.isArray(data?.libraries)?data.libraries:[];
    const status=card.querySelector('[data-jellyfin-status]');
    if(status){status.className='service-status-badge online';status.textContent=server.pending_restart?'Online · Restart pending':'Online'}
    const name=card.querySelector('[data-jellyfin-name]');if(name)name.textContent=server.name||'Jellyfin';
    const meta=card.querySelector('[data-jellyfin-meta]');
    if(meta){const parts=[];if(server.version)parts.push(`Jellyfin ${server.version}`);if(server.operating_system)parts.push(server.operating_system);meta.textContent=parts.join(' · ')||'Connected'}
    const count=card.querySelector('[data-jellyfin-library-count]');if(count)count.textContent=`${libraries.length} ${libraries.length===1?'library':'libraries'}`;
    const list=card.querySelector('[data-jellyfin-libraries]');if(!list)return;
    if(!libraries.length){list.innerHTML='<div class="integration-service-empty">No libraries reported</div>';return}
    list.innerHTML=libraries.map(library=>{const locations=(library.locations||[]).map(value=>String(value||'').trim()).filter(Boolean);const statusText=String(library.refresh_status||'').trim();const progress=Number(library.refresh_progress);const scan=Number.isFinite(progress)?`${Math.max(0,Math.min(100,progress)).toFixed(progress%1?1:0)}%${statusText?` · ${esc(uiText(statusText))}`:''}`:(statusText?esc(uiText(statusText)):'Idle');return `<article class="jellyfin-library-row"><div class="jellyfin-library-copy"><strong>${esc(library.name||'Library')}</strong><span>${esc(jellyfinLibraryType(library.collection_type))}</span></div><div class="jellyfin-library-paths">${locations.length?locations.map(value=>`<code>${esc(value)}</code>`).join(''):'<span>Location not reported</span>'}</div><div class="jellyfin-library-scan"><span>Scan</span><strong>${scan}</strong></div></article>`;}).join('');
  }

  function jellyfinTaskRelative(value) {
    const timestamp=Date.parse(String(value||''));if(!Number.isFinite(timestamp))return '';
    const seconds=Math.max(0,Math.round((Date.now()-timestamp)/1000));
    if(seconds<60)return 'less than a minute ago';
    if(seconds<3600){const n=Math.max(1,Math.round(seconds/60));return `about ${n} minute${n===1?'':'s'} ago`}
    if(seconds<86400){const n=Math.max(1,Math.round(seconds/3600));return `about ${n} hour${n===1?'':'s'} ago`}
    const n=Math.max(1,Math.round(seconds/86400));return `${n} day${n===1?'':'s'} ago`;
  }

  function jellyfinTaskDuration(startValue,endValue) {
    const start=Date.parse(String(startValue||'')),end=Date.parse(String(endValue||''));if(!Number.isFinite(start)||!Number.isFinite(end)||end<start)return '';
    const seconds=Math.max(0,Math.round((end-start)/1000));
    if(seconds<60)return 'less than a minute';
    if(seconds<3600){const n=Math.max(1,Math.round(seconds/60));return `${n} minute${n===1?'':'s'}`}
    const n=Math.max(1,Math.round(seconds/3600));return `${n} hour${n===1?'':'s'}`;
  }

  function jellyfinTaskSubtitle(task) {
    if(task.running){const progress=Number(task.progress);return Number.isFinite(progress)?`Running · ${Math.round(Math.max(0,Math.min(100,progress)))}%`:'Running'}
    const when=jellyfinTaskRelative(task.last_end||task.last_start);if(!when)return 'Has not run yet.';
    const duration=jellyfinTaskDuration(task.last_start,task.last_end),status=String(task.last_status||'').toLowerCase(),failed=status&&!['completed','success','succeeded'].includes(status);
    if(failed)return `Last run ${uiText(status)} ${when}${duration?`, after ${duration}`:''}.`;
    return `Last ran ${when}${duration?`, taking ${duration}`:''}.`;
  }

  function renderJellyfinTasks(card, tasks) {
    const list=card.querySelector('[data-jellyfin-tasks]');if(!list)return;
    const count=card.querySelector('[data-jellyfin-task-count]');if(count)count.textContent=`${tasks.length} ${tasks.length===1?'task':'tasks'}`;
    const runtime=card.querySelector('[data-jellyfin-service]');if(runtime)runtime.dataset.taskRunning=tasks.some(task=>task.running)?'1':'0';
    if(!tasks.length){list.innerHTML='<div class="integration-service-empty">No scheduled tasks reported</div>';return}
    const groups=new Map();tasks.forEach(task=>{const category=String(task.category||'Other').trim()||'Other';if(!groups.has(category))groups.set(category,[]);groups.get(category).push(task)});
    list.innerHTML=[...groups.entries()].map(([category,items])=>`<section class="jellyfin-task-group"><div class="jellyfin-task-category">${esc(category)}</div><div class="jellyfin-task-group-list">${items.map(task=>{const status=String(task.last_status||'').toLowerCase(),failed=!task.running&&status&&!['completed','success','succeeded'].includes(status),action=task.running?'stop':'start',label=task.running?`Stop ${task.name||'scheduled task'}`:`Run ${task.name||'scheduled task'}`;return `<article class="jellyfin-task-row${task.running?' running':''}${failed?' failed':''}"><span class="jellyfin-task-clock">${jellyfinTaskIcon('schedule')}</span><div class="jellyfin-task-copy"><strong>${esc(task.name||'Scheduled task')}</strong><span>${esc(jellyfinTaskSubtitle(task))}</span></div><button class="jellyfin-task-action" type="button" data-task-id="${esc(task.id||'')}" data-action="${action}" aria-label="${esc(label)}" title="${esc(label)}">${jellyfinTaskIcon(task.running?'stop':'play')}</button></article>`;}).join('')}</div></section>`).join('');
  }

  function scheduleJellyfinTaskPoll(card) {
    if(card._jellyfinTaskTimer)clearTimeout(card._jellyfinTaskTimer);
    const runtime=card.querySelector('[data-jellyfin-service]');if(runtime?.dataset.taskRunning!=='1')return;
    card._jellyfinTaskTimer=setTimeout(()=>{if(!card.isConnected||card.querySelector('.accordion-body')?.classList.contains('hidden'))return;loadJellyfinTasks(card,{quiet:true});},2000);
  }

  async function loadJellyfinTasks(card,{quiet=false}={}) {
    if(!card?.dataset.id||card.dataset.type!=='jellyfin')return;
    const list=card.querySelector('[data-jellyfin-tasks]');if(!list||list.dataset.loading==='1')return;
    list.dataset.loading='1';if(!quiet&&!list.querySelector('.jellyfin-task-row'))list.innerHTML='<div class="integration-service-empty">Loading scheduled tasks…</div>';
    try{const data=await api(`/api/integrations/jellyfin/tasks?id=${encodeURIComponent(card.dataset.id)}`);const tasks=Array.isArray(data?.tasks)?data.tasks:[];renderJellyfinTasks(card,tasks);scheduleJellyfinTaskPoll(card)}catch(error){const count=card.querySelector('[data-jellyfin-task-count]');if(count)count.textContent='Unavailable';if(!quiet)list.innerHTML=`<div class="integration-service-empty">${esc(error.message||'Scheduled tasks unavailable')}</div>`}finally{delete list.dataset.loading}
  }

  function toggleJellyfinTasks(card) {
    const summary=card.querySelector('.jellyfin-task-summary'),body=card.querySelector('[data-jellyfin-task-body]');if(!summary||!body)return;
    const open=body.classList.contains('hidden');body.classList.toggle('hidden',!open);summary.setAttribute('aria-expanded',String(open));if(open)loadJellyfinTasks(card);
  }

  async function runJellyfinTask(card,button) {
    const taskId=String(button?.dataset.taskId||'').trim(),action=String(button?.dataset.action||'start');if(!taskId||!card?.dataset.id)return;
    button.disabled=true;
    try{const result=await post('/api/integrations/jellyfin/task',{id:card.dataset.id,task_id:taskId,action});toast(result.message||`Jellyfin scheduled task ${action==='stop'?'stop requested':'started'}`);await new Promise(resolve=>setTimeout(resolve,350));await loadJellyfinTasks(card)}catch(error){toast(error.message||'Could not change Jellyfin scheduled task','error')}finally{button.disabled=false}
  }

  async function loadJellyfinOverview(card) {
    if(!card?.dataset.id||card.dataset.type!=='jellyfin')return;
    const runtime=card.querySelector('[data-jellyfin-service]');if(!runtime||runtime.dataset.loading==='1')return;
    runtime.dataset.loading='1';const status=card.querySelector('[data-jellyfin-status]');if(status){status.className='service-status-badge checking';status.textContent='Checking…'}
    try{const data=await api(`/api/integrations/jellyfin/status?id=${encodeURIComponent(card.dataset.id)}`);runtime.dataset.loaded='1';renderJellyfinOverview(card,data)}catch(error){if(status){status.className='service-status-badge offline';status.textContent='Offline'}const meta=card.querySelector('[data-jellyfin-meta]');if(meta)meta.textContent=error.message||'Could not load Jellyfin status';const count=card.querySelector('[data-jellyfin-library-count]');if(count)count.textContent='Unavailable';const list=card.querySelector('[data-jellyfin-libraries]');if(list)list.innerHTML='<div class="integration-service-empty">Libraries unavailable</div>'}finally{delete runtime.dataset.loading}
  }

  async function refreshJellyfinLibraries(card) {
    if(!card?.dataset.id)return;
    const button=card.querySelector('.jellyfin-refresh-libraries');if(button)button.disabled=true;
    try{const result=await post('/api/integrations/jellyfin/refresh',{id:card.dataset.id});toast(result.message||'Jellyfin library refresh requested');await new Promise(resolve=>setTimeout(resolve,700));await loadJellyfinOverview(card)}catch(error){toast(error.message||'Could not refresh Jellyfin libraries','error')}finally{if(button)button.disabled=false}
  }

'''
          text = text[:start] + new_segment + text[end:]
          text = replace_once(text, "        if(open&&card.dataset.type==='jellyfin'&&card.dataset.id)loadJellyfinOverview(card);", "        if(open&&card.dataset.type==='jellyfin'&&card.dataset.id){loadJellyfinOverview(card);loadJellyfinTasks(card);}", 'Jellyfin accordion open behavior')
          text = replace_once(text, "      card.querySelector('.jellyfin-refresh-libraries')?.addEventListener('click', () => refreshJellyfinLibraries(card));\n", "      card.querySelector('.jellyfin-refresh-libraries')?.addEventListener('click', () => refreshJellyfinLibraries(card));\n      card.querySelector('.jellyfin-task-summary')?.addEventListener('click', () => toggleJellyfinTasks(card));\n      card.querySelector('[data-jellyfin-tasks]')?.addEventListener('click', event => { const button=event.target.closest('.jellyfin-task-action'); if(button) runJellyfinTask(card,button); });\n", 'Jellyfin task event handlers')
          text = replace_once(text, "      if(index===0&&card.dataset.type==='jellyfin'&&card.dataset.id)setTimeout(()=>loadJellyfinOverview(card),0);", "      if(index===0&&card.dataset.type==='jellyfin'&&card.dataset.id)setTimeout(()=>{loadJellyfinOverview(card);loadJellyfinTasks(card)},0);", 'Jellyfin initial load')
          write(path, text)

          path = 'static/settings.css'
          text = read(path) + r'''

/* 0.5.124 Jellyfin scheduled task controls. */
.jellyfin-task-section{overflow:hidden;border:1px solid var(--border);border-radius:11px;background:color-mix(in srgb,var(--panel2) 35%,transparent)}
.jellyfin-task-summary{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border:0;border-radius:0;background:transparent;color:var(--text);text-align:left}.jellyfin-task-summary:hover{background:color-mix(in srgb,var(--panel2) 68%,transparent)}
.jellyfin-task-summary-main{display:flex;align-items:center;gap:8px;min-width:0}.jellyfin-task-summary-main>span:last-child{display:grid;gap:2px;min-width:0}.jellyfin-task-summary strong{font-size:11px}.jellyfin-task-summary small{font-size:8.5px;color:var(--muted)}
.jellyfin-task-chevron{display:grid;place-items:center;flex:0 0 20px;width:20px;height:20px;color:var(--muted);transition:transform .16s ease}.jellyfin-task-chevron .material-symbol-icon{width:18px;height:18px;fill:currentColor}.jellyfin-task-summary[aria-expanded="true"] .jellyfin-task-chevron{transform:rotate(90deg)}
.jellyfin-task-body{padding:0 9px 9px;border-top:1px solid var(--border)}.jellyfin-task-list{display:grid;gap:9px;padding-top:9px}.jellyfin-task-group{display:grid;gap:5px}.jellyfin-task-category{padding:0 3px;color:var(--muted);font-size:8.5px;font-weight:650;letter-spacing:.015em}.jellyfin-task-group-list{display:grid;gap:4px}
.jellyfin-task-row{display:grid;grid-template-columns:28px minmax(0,1fr) 30px;gap:8px;align-items:center;min-height:48px;padding:7px 7px 7px 8px;border-radius:9px;background:color-mix(in srgb,var(--panel2) 52%,transparent)}.jellyfin-task-row:hover{background:color-mix(in srgb,var(--panel2) 76%,transparent)}
.jellyfin-task-clock{display:grid;place-items:center;width:26px;height:26px;border-radius:999px;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}.jellyfin-task-clock .material-symbol-icon{width:17px;height:17px;fill:currentColor}.jellyfin-task-copy{display:grid;gap:2px;min-width:0}.jellyfin-task-copy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;color:var(--text)}.jellyfin-task-copy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:8.5px;color:var(--muted)}.jellyfin-task-row.running .jellyfin-task-copy span{color:var(--accent)}.jellyfin-task-row.failed .jellyfin-task-copy span{color:var(--bad)}
.jellyfin-task-action{display:grid;place-items:center;width:30px;height:30px;min-width:30px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--text)}.jellyfin-task-action:hover{background:var(--panel3);color:var(--accent)}.jellyfin-task-action:disabled{opacity:.45}.jellyfin-task-action .material-symbol-icon{width:20px;height:20px;fill:currentColor}
@media(max-width:700px){.jellyfin-task-row{grid-template-columns:26px minmax(0,1fr) 30px;gap:7px}.jellyfin-task-copy strong{font-size:10px}.jellyfin-task-copy span{white-space:normal;line-height:1.35}}
