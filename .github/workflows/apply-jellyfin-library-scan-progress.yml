name: Apply Jellyfin library scan progress

on:
  push:
    branches:
      - feature/jellyfin-library-scan-progress

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply library scan progress update
        run: python release_tools/apply_jellyfin_library_scan_progress.py

      - name: Validate
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          python release_tools/generate_release_notes.py --version 0.5.132 --check
          grep -q 'data-jellyfin-library-progress' static/settings.js
          grep -q 'function scheduleJellyfinLibraryPoll' static/settings.js
          grep -q 'Scan media library' static/settings.js
          grep -q 'VERSION = "0.5.132"' dashboard.py

      - name: Commit validated source
        shell: bash
        run: |
          rm -f release_tools/apply_jellyfin_library_scan_progress.py .github/workflows/apply-jellyfin-library-scan-progress.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Show Jellyfin library scan progress'
          git push
