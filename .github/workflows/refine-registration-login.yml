name: Refine registration login

on:
  push:
    branches:
      - feature/refine-registration-login

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/refine-registration-login
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install project dependencies
        run: python -m pip install .
      - name: Apply registration refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8')
          def rep(path,old,new,count=None):
              text=read(path); found=text.count(old)
              if not found: raise RuntimeError(f'{path}: expected text not found: {old[:100]!r}')
              if count is not None and found!=count: raise RuntimeError(f'{path}: expected {count}, found {found}')
              write(path,text.replace(old,new))

          for path in ['src/torrent_dashboard/__init__.py','static/index.html','static/app.js','static/sw.js']:
              rep(path,'0.5.160','0.5.161')
          rep('static/sw.js','torrent-dashboard-v05160','torrent-dashboard-v05161',1)

          # Login card and registration form.
          rep('static/index.html',
              '<div class="login-tabs" aria-label="Access options"><button class="active" id="loginSignInTab" type="button" aria-selected="true">Sign in</button><button id="loginRegisterTab" type="button" aria-selected="false">Register</button><button id="loginRecoveryTab" type="button" aria-selected="false">Recovery</button></div>',
              '<div class="login-tabs" aria-label="Access options"><button class="active" id="loginSignInTab" type="button" aria-selected="true">Sign in</button><button id="loginRecoveryTab" type="button" aria-selected="false">Recovery</button></div>',1)
          rep('static/index.html',
              '<button class="primary" type="submit">Sign in</button><div class="form-error" id="loginError"></div></form>',
              '<button class="primary" type="submit">Sign in</button><div class="form-error" id="loginError"></div><button class="login-account-link" id="loginRegisterLink" type="button">Create an account</button></form>',1)
          html=read('static/index.html')
          pattern=r'<section class="login-pane hidden" id="loginRegisterPane">.*?</section>'
          register='<section class="login-pane hidden" id="loginRegisterPane"><h1>Create account</h1><p>Choose a username and password. An administrator must approve the account before you can sign in.</p><form autocomplete="off" id="registerForm"><input autocapitalize="none" autocomplete="username" id="registerUser" placeholder="Username" spellcheck="false" required/><input autocomplete="new-password" id="registerPass" minlength="8" placeholder="Password" type="password" required/><button class="primary" type="submit">Create account</button><div class="form-error" id="registerError"></div><div class="test-result muted" id="registerStatus"></div><button class="login-account-link" id="loginBackToSignIn" type="button">Back to sign in</button></form></section>'
          html,n=re.subn(pattern,register,html,count=1,flags=re.S)
          if n!=1: raise RuntimeError('registration pane replacement failed')
          write('static/index.html',html)

          # Public login/register behavior.
          app=read('static/app.js')
          app=app.replace("$('#loginRegisterTab')?.classList.toggle('active',register);",'')
          app=app.replace("$('#loginRegisterTab')?.setAttribute('aria-selected',String(register));",'')
          app=app.replace("$('#loginRegisterTab')?.addEventListener('click',()=>setLoginMode('register'));", "$('#loginRegisterLink')?.addEventListener('click',()=>setLoginMode('register'));$('#loginBackToSignIn')?.addEventListener('click',()=>setLoginMode('signin'));")
          handler="async function registerAccount(event){event.preventDefault();const error=$('#registerError'),status=$('#registerStatus'),button=$('#registerForm button[type=\"submit\"]');if(error)error.textContent='';if(status){status.className='test-result muted';status.textContent=''}const password=$('#registerPass')?.value||'';if(password.length<8){if(error)error.textContent='Password must be at least 8 characters';return}if(button)button.disabled=true;try{const data=await rawJson('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#registerUser')?.value.trim()||'',password})});$('#registerForm')?.reset();if(status){status.className='test-result ok';status.textContent=data.message||'Registration submitted. Your account is Pending.'}}catch(err){if(error)error.textContent=err.message||'Registration could not be submitted'}finally{if(button)button.disabled=false}}"
          app,n=re.subn(r'async function registerAccount\(event\)\{.*?\}\nasync function recoverDashboard',handler+'\nasync function recoverDashboard',app,count=1,flags=re.S)
          if n!=1: raise RuntimeError('registerAccount replacement failed')
          if 'loginRegisterTab' in app: raise RuntimeError('obsolete Register tab reference remains')
          write('static/app.js',app)

          marker='.login-tabs .active,.login-tabs button:hover{background:var(--panel2);color:var(--text)}'
          style=marker+'.login-account-link{justify-self:center;border:0;background:transparent;color:var(--accent);padding:2px 0;border-radius:0;font-size:11px;text-decoration:underline;text-underline-offset:3px}.login-account-link:hover{background:transparent;color:color-mix(in srgb,var(--accent) 82%,var(--text))}.login-account-link:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);outline:none}'
          rep('static/app.css',marker,style,1)

          # Pending is the canonical user-facing status.
          rep('src/torrent_dashboard/users.py','"pending": "Pending approval",','"pending": "Pending",',1)
          rep('static/settings.js','Pending approval','Pending')

          # Registration API only requires username and password.
          rep('src/torrent_dashboard/dashboard.py','        if str(data.get("password") or "") != str(data.get("password2") or ""):\n            return self.send_json(400,{"error":"Passwords do not match"})\n','',1)
          rep('src/torrent_dashboard/dashboard.py','"message":"Registration submitted. Your account is pending administrator approval."','"message":"Registration submitted. Your account is Pending."',1)
          rep('src/torrent_dashboard/dashboard.py','return self.send_json(403,{"error":"Your account is pending administrator approval."})','return self.send_json(403,{"error":"Your account is Pending. An administrator must approve it before you can sign in."})',1)

          Path('tests/test_registration_ui.py').write_text('''from pathlib import Path\nimport unittest\n\nROOT=Path(__file__).resolve().parents[1]\n\nclass RegistrationUiContractTests(unittest.TestCase):\n    def test_public_registration_link_and_pending_admin_queue_exist(self):\n        html=(ROOT/"static"/"index.html").read_text(encoding="utf-8")\n        app=(ROOT/"static"/"app.js").read_text(encoding="utf-8")\n        settings=(ROOT/"static"/"settings.js").read_text(encoding="utf-8")\n        self.assertIn('id="loginRegisterLink"',html)\n        self.assertIn('>Create an account</button>',html)\n        self.assertNotIn('id="loginRegisterTab"',html)\n        self.assertIn('id="loginBackToSignIn"',html)\n        self.assertIn('id="registerForm"',html)\n        self.assertIn('id="registerUser"',html)\n        self.assertIn('id="registerPass"',html)\n        for removed in ('registerFirstName','registerLastName','registerEmail','registerPass2'):\n            self.assertNotIn(f'id="{removed}"',html)\n            self.assertNotIn(f"$('#{removed}')",app)\n        self.assertIn('id="pendingUserList"',html)\n        self.assertIn("rawJson('/api/register'",app)\n        self.assertIn("setLoginMode('register')",app)\n        self.assertIn("post('/api/users/approve'",settings)\n        self.assertIn("post('/api/users/reject'",settings)\n        self.assertIn('>Pending</span>',settings)\n        self.assertNotIn('Pending approval',settings)\n\n    def test_backend_marks_pending_login_and_exposes_approval_routes(self):\n        source=(ROOT/"src"/"torrent_dashboard"/"dashboard.py").read_text(encoding="utf-8")\n        self.assertIn('path=="/api/register"',source)\n        self.assertIn('user.get("status") == "pending"',source)\n        self.assertIn('Your account is Pending. An administrator must approve it before you can sign in.',source)\n        self.assertNotIn('data.get("password2")',source)\n        self.assertIn('path=="/api/users/approve"',source)\n        self.assertIn('path=="/api/users/reject"',source)\n\nif __name__ == "__main__":\n    unittest.main()\n''',encoding='utf-8')
          rep('tests/test_user_registration.py','self.assertEqual(public_user(user)["status_label"],"Pending approval")','self.assertEqual(public_user(user)["status_label"],"Pending")',1)

          validator=read('release_tools/validate_ui_strings.py')
          old="""    assert 'id=\"loginRegisterTab\"' in html and 'id=\"registerForm\"' in html\n    assert 'id=\"pendingUserList\"' in html\n    assert \"rawJson('/api/register'\" in app_js\n    assert \"post('/api/users/approve'\" in settings_js and \"post('/api/users/reject'\" in settings_js\n    assert 'path==\"/api/register\"' in dashboard_py and 'pending administrator approval' in dashboard_py\n"""
          new="""    assert 'id=\"loginRegisterLink\"' in html and 'id=\"registerForm\"' in html\n    assert 'id=\"loginRegisterTab\"' not in html and 'id=\"loginBackToSignIn\"' in html\n    assert 'id=\"registerUser\"' in html and 'id=\"registerPass\"' in html\n    assert all(f'id=\"{control}\"' not in html for control in ('registerFirstName','registerLastName','registerEmail','registerPass2'))\n    assert 'id=\"pendingUserList\"' in html\n    assert \"rawJson('/api/register'\" in app_js\n    assert \"post('/api/users/approve'\" in settings_js and \"post('/api/users/reject'\" in settings_js\n    assert 'path==\"/api/register\"' in dashboard_py and 'Your account is Pending.' in dashboard_py\n"""
          if old not in validator: raise RuntimeError('UI validator registration block not found')
          write('release_tools/validate_ui_strings.py',validator.replace(old,new,1))

          notes_path=Path('release_notes/releases.json')
          notes=json.loads(notes_path.read_text(encoding='utf-8'))
          previous=notes['releases'][0]
          if any(x.get('version')=='0.5.161' for x in notes['releases']): raise RuntimeError('v0.5.161 already exists')
          notes['releases'].insert(0,{
              'version':'0.5.161','date':'2026-09-14','status':'prerelease','title':'Simplify registration and Pending status',
              'summary':'Refines self-registration with a simpler login entry point, a username-and-password-only registration form, and concise Pending status language.',
              'highlights':['Moves Create an account beneath the Sign in button instead of presenting Register as a top-level access tab.','Simplifies registration to Username and Password; profile details can be completed after the account is approved and the user signs in.','Shortens the account state label from Pending approval to Pending.','Pending users are told that administrator approval is still required before sign-in.'],
              'fixes':[],
              'technical':['The public registration API no longer requires a duplicate password2 field.','Approval, rejection, rate limiting, Standard-user assignment, and pending-session blocking remain unchanged.'],
              'validation':['Updates registration UI/backend contract tests and Pending status domain coverage.','Runs the standard Ubuntu/Windows Python 3.13/3.14 matrix, source updater build, and Windows executable smoke tests.'],
              'known_issues':list(previous.get('known_issues',[])),
              'architecture':['Registration captures only the credentials required to establish identity; optional profile data remains an authenticated account-setting concern.'],
              'decisions':['Create an account is a secondary action beneath Sign in rather than a peer access tab.','Pending is the canonical user-facing label for accounts awaiting administrator action.','Registration collects only username and password; profile details are deferred until after access is granted.'],
              'next_steps':[{'priority':1,'title':'Verify simplified registration','detail':'Create a test account from the Sign in card, confirm the Pending login message, approve it, and complete the profile after signing in.'}]
          })
          notes_path.write_text(json.dumps(notes,indent=2)+'\n',encoding='utf-8')

          current={'schema':1,'status':'release-candidate','objective':'Publish v0.5.161 with simplified account registration','why':'Registration should stay focused on credentials, while Pending status and the login entry point should be concise and familiar.','acceptance_criteria':['Create an account appears beneath the Sign in button instead of as a top-level Register tab.','Public registration collects only Username and Password.','New registrations remain Standard users with Pending status and cannot create sessions.','Valid credentials for a Pending account explain that administrator approval is required before sign-in.','Administrators can still approve or reject requests under Settings → Users.','Approved users can complete optional profile information after signing in.','The full source matrix, source updater build, and compiled Windows smoke tests pass.','v0.5.161 publishes source and Windows updater packages with SHA-256 digests.'],'decisions':['Create an account is a secondary action beneath Sign in.','Pending is the canonical user-facing label for accounts awaiting administrator action.','Registration collects only username and password; optional profile details are completed after access is granted.'],'files':['src/torrent_dashboard/users.py','src/torrent_dashboard/dashboard.py','static/index.html','static/app.js','static/app.css','static/settings.js','tests/test_user_registration.py','tests/test_registration_ui.py','release_tools/validate_ui_strings.py','release_notes/releases.json','development/current.json'],'blockers':[],'out_of_scope':['No email verification, invitation codes, CAPTCHA, MFA, or automatic approval in this release.'],'next_action':'Run full pull-request validation and Windows packaging; if green, merge and verify the complete updater-visible v0.5.161 release.'}
          Path('development/current.json').write_text(json.dumps(current,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Regenerate release documentation
        run: python release_tools/generate_release_notes.py --version 0.5.161
      - name: Validate source and UI contracts
        run: |
          PYTHONPATH=src python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
      - name: Commit prepared release candidate
        shell: bash
        run: |
          rm .github/workflows/refine-registration-login.yml
          git config user.name "Cynica"
          git config user.email "47292146+CynicaGaming@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.5.161 — Simplify registration flow"
          git push origin HEAD:feature/refine-registration-login
