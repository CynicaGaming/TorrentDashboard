name: Validate backup management

on:
  push:
    branches:
      - feature/backup-management
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-backup-management-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply backup management release
        shell: bash
        run: |
          python release_tools/apply_v0_5_147.py
          python release_tools/generate_release_notes.py --version 0.5.147
      - name: Validate source and backup behavior
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          python release_tools/build_release.py --repo "${{ github.repository }}" --tag v0.5.147 --output dist-test
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          path = Path('dist-test/Torrent-Dashboard-0.5.147.zip')
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              info = json.loads(z.read('Torrent-Dashboard-0.5.147/package-info.json'))
              assert info['distribution'] == 'source'
              assert info['layout'] == 'src'
              assert 'Torrent-Dashboard-0.5.147/src/torrent_dashboard/backups.py' in names
              assert 'Torrent-Dashboard-0.5.147/tests/test_backups.py' in names
              assert 'Torrent-Dashboard-0.5.147/static/settings.js' in names
          PY
      - name: Commit validated backup feature
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "Cynica"
          git config user.email "47292146+CynicaGaming@users.noreply.github.com"
          git add -A
          git reset .github/workflows/validate-backup-management.yml release_tools/apply_v0_5_147.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Add portable backup management"
          git push origin HEAD:feature/backup-management

  validate-windows:
    needs: validate-source
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/backup-management
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply feature if generated commit has not landed yet
        shell: pwsh
        run: |
          python release_tools/apply_v0_5_147.py
          python release_tools/generate_release_notes.py --version 0.5.147
      - name: Run backup tests
        shell: pwsh
        run: python -m unittest tests.test_backups -v
      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install "pyinstaller==6.22.2"
      - name: Build and smoke-test Windows package
        shell: pwsh
        run: |
          python release_tools/build_windows.py --repo "${{ github.repository }}" --tag v0.5.147 --output dist-windows
          $pkg = "dist-windows\TorrentDashboard-Windows-0.5.147-x64"
          & "$pkg\Dashboard.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Dashboard.exe --help failed" }
          & "$pkg\Recovery.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Recovery.exe --help failed" }
          & "$pkg\Updater.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Updater.exe --help failed" }
          foreach ($name in @("Dashboard.exe","Recovery.exe","Updater.exe","static\index.html","package-info.json")) {
            if (-not (Test-Path "$pkg\$name")) { throw "Missing $name" }
          }
          $info = Get-Content "$pkg\package-info.json" | ConvertFrom-Json
          if ($info.distribution -ne 'windows-x64') { throw "Wrong distribution" }
          if ($info.layout -ne 'windows-bundle-v1') { throw "Wrong Windows package layout" }
