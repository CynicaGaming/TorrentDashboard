name: Torrent Dashboard Pre-Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrent-dashboard-prerelease
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply Pending Pre-Release Cleanup
        shell: bash
        run: |
          if [ -f release_tools/apply_cleanup.py.gz.b64 ]; then
            base64 -d release_tools/apply_cleanup.py.gz.b64 | gzip -d > release_tools/apply_cleanup.py
            python release_tools/apply_cleanup.py
            rm -f release_tools/apply_cleanup.py release_tools/apply_cleanup.py.gz.b64
          fi

      - name: Validate Source
        shell: bash
        run: |
          python -m py_compile dashboard.py updater.py
          node --check static/app.js
          python - <<'PY'
          import dashboard
          assert callable(dashboard.normalize_server_input)
          PY

      - name: Commit Cleanup
        id: source
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply Torrent Dashboard prerelease cleanup"
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine Version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          text=open('dashboard.py', encoding='utf-8').read()
          print(re.search(r'^VERSION\s*=\s*["\']([^"\']+)', text, re.M).group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Replace Existing Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          if [ "$TAG" != "v3.4.0" ]; then
            gh release delete "v3.4.0" --cleanup-tag --yes >/dev/null 2>&1 || true
          fi

      - name: Build Release Package
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: python release_tools/build_release.py --repo "$REPO" --tag "$TAG" --output dist

      - name: Publish GitHub Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        shell: bash
        run: |
          ZIP=$(find dist -maxdepth 1 -type f \( -name 'Torrent-Dashboard-*.zip' -o -name 'Torrent-Desk-*.zip' \) | head -n 1)
          test -n "$ZIP"
          gh release create "$TAG" \
            "$ZIP" \
            --target "$RELEASE_SHA" \
            --title "Torrent Dashboard Pre-Release" \
            --generate-notes \
            --prerelease
