name: Torrent Dashboard Pre-Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrent-dashboard-prerelease
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply Pending Pre-Release Cleanup
        shell: bash
        run: |
          shopt -s nullglob
          parts=(release_tools/cleanup.part*)
          if [ ${#parts[@]} -gt 0 ]; then
            cat "${parts[@]}" | base64 -d | gzip -d > release_tools/apply_cleanup.py
            python release_tools/apply_cleanup.py
            rm -f release_tools/apply_cleanup.py "${parts[@]}"
          fi
          if [ -f release_tools/apply_cleanup.py.gz.b64 ]; then
            base64 -d release_tools/apply_cleanup.py.gz.b64 | gzip -d > release_tools/apply_cleanup.py
            python release_tools/apply_cleanup.py
            rm -f release_tools/apply_cleanup.py release_tools/apply_cleanup.py.gz.b64
          fi

      - name: Validate Source
        shell: bash
        run: |
          python -m py_compile dashboard.py updater.py release_tools/build_release.py
          node --check static/app.js
          python - <<'PY'
          import dashboard
          assert dashboard.VERSION.startswith('0.')
          assert callable(dashboard.normalize_qbittorrent_server)
          sample = dashboard.normalize_qbittorrent_server({
              'base_url': 'http://127.0.0.1:8080',
              'auth_method': 'api_key',
              'api_key': 'qbt_' + ('A' * 28),
              'name': 'Desktop',
          })
          assert sample['name'] == 'Desktop'
          PY

      - name: Commit Pre-Release Cleanup
        id: source
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply Torrent Dashboard 0.x prerelease cleanup"
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine Version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          text=open('dashboard.py', encoding='utf-8').read()
          print(re.search(r'^VERSION\s*=\s*["\']([^"\']+)', text, re.M).group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Replace Existing Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          for old_tag in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.prerelease == true) | .tag_name'); do
            gh release delete "$old_tag" --cleanup-tag --yes >/dev/null 2>&1 || true
          done
          gh release delete "v3.4.0" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true

      - name: Build Release Package
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: python release_tools/build_release.py --repo "$REPO" --tag "$TAG" --output dist

      - name: Publish GitHub Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        shell: bash
        run: |
          ZIP=$(find dist -maxdepth 1 -type f -name 'Torrent-Dashboard-*.zip' | head -n 1)
          test -n "$ZIP"
          gh release create "$TAG" \
            "$ZIP" \
            --target "$RELEASE_SHA" \
            --title "Torrent Dashboard Pre-Release" \
            --notes "Development prerelease. Version: $TAG" \
            --prerelease
