name: Torrent Dashboard Pre-Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrent-dashboard-prerelease
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply Pending Feature Update
        shell: bash
        run: |
          if [ -f release_tools/apply_feature_update.py ]; then
            python release_tools/apply_feature_update.py
            rm -f release_tools/apply_feature_update.py
          fi

      - name: Validate Source
        shell: bash
        run: |
          python -m py_compile dashboard.py updater.py release_tools/build_release.py
          node --check static/app.js
          node --check static/settings.js

          # Syntax alone did not catch the 0.5.2 TDSettings regression. This
          # verifies that the settings module actually initializes its public API.
          node - <<'JS'
          global.window = {};
          const fs = require('fs');
          eval(fs.readFileSync('static/settings.js','utf8'));
          if (!window.TDSettings || typeof window.TDSettings.bind !== 'function' || typeof window.TDSettings.fill !== 'function') {
            throw new Error('settings.js did not initialize window.TDSettings');
          }
          JS

          python - <<'PY'
          import pathlib
          import re
          import dashboard

          version = dashboard.VERSION
          assert re.fullmatch(r'0\.\d+\.\d+', version), version
          assert callable(dashboard.normalize_qbittorrent_server)
          assert callable(dashboard.normalize_integration)
          assert callable(dashboard.normalize_user)
          assert hasattr(dashboard, 'SingleInstanceLock')
          first_lock = dashboard.SingleInstanceLock()
          second_lock = dashboard.SingleInstanceLock()
          assert first_lock.acquire() is True
          try:
              assert second_lock.acquire() is False
          finally:
              first_lock.release()
          third_lock = dashboard.SingleInstanceLock()
          assert third_lock.acquire() is True
          third_lock.release()
          assert dashboard.DEFAULT_CONFIG.get('integrations') == []
          assert dashboard.DEFAULT_CONFIG.get('users') == []
          assert {'discord','ntfy','generic_webhook'} <= set(dashboard.INTEGRATION_TYPES)

          sample = dashboard.normalize_qbittorrent_server({
              'base_url': 'http://127.0.0.1:8080',
              'auth_method': 'api_key',
              'api_key': 'qbt_' + ('A' * 28),
              'name': 'Desktop',
          })
          assert sample['name'] == 'Desktop'

          user = dashboard.normalize_user({
              'username': 'admin2',
              'password': 'test-password',
              'group': 'administrator',
          }, require_password=True)
          assert user['group'] == 'administrator' and user['password_hash']

          integ = dashboard.normalize_integration({
              'type': 'sonarr',
              'name': 'Sonarr',
              'url': 'http://127.0.0.1:8989',
              'api_key': 'abc123',
          })
          assert integ['type'] == 'sonarr'

          html = pathlib.Path('static/index.html').read_text(encoding='utf-8')
          js = pathlib.Path('static/settings.js').read_text(encoding='utf-8')
          app_js = pathlib.Path('static/app.js').read_text(encoding='utf-8')
          css = pathlib.Path('static/settings.css').read_text(encoding='utf-8')
          sw = pathlib.Path('static/sw.js').read_text(encoding='utf-8')
          sound = pathlib.Path('static/default-completion.wav')

          assert 'API Key (qBitTorrent 5.2+)' in html
          assert 'User Management' in html
          assert 'integrationTypeSelect' in html
          assert '<b>Local Dashboard Address</b>' in html
          assert 'Local IP Address' not in html
          assert '>IP Address<input id="wLocalIp"' in html
          assert '<label>IP Address<input id="sLocalIp"' in html
          assert f'/static/settings.js?v={version}' in html
          assert f'/static/settings.css?v={version}' in html
          assert f'/static/app.js?v={version}' in html
          assert f'?v={version}' in sw
          assert 'Read Only Mode' not in html
          assert 'iSonarrUrl' not in html
          assert 'Standard Users have read-only dashboard access' in js
          assert "const SECRET_MASK = '••••••••••';" in js
          assert "const CONFIGURED_SECRET_MASK='••••••••••';" in app_js
          assert "input.value=configured?CONFIGURED_SECRET_MASK:''" in app_js
          assert "btn.textContent='Stored'" in app_js
          assert 'Configured — Leave Blank To Keep' not in js
          assert 'Token Configured — Leave Blank To Keep' not in js
          assert '.settings-page .settings-card{max-width:none;width:100%}' in css
          assert '.secret-toggle:disabled' in css
          assert 'id="updateAction"' in html
          assert 'id="checkUpdate"' not in html
          assert 'id="downloadUpdate"' not in html
          assert 'id="installUpdate"' not in html
          assert 'function showLogin(reset=false)' in app_js
          assert 'async function handleUpdateAction()' in app_js
          assert 'function applySentenceCaseUi' in app_js
          assert 'applyTitleCaseUi' not in app_js
          assert "uiText('installAndRestart')" in app_js
          assert '@media(min-width:821px){.settings-nav{margin-top:0}}' in css
          assert 'margin-top:52px' not in css
          assert all(old not in html for old in ('id="nWebhook"','id="nDiscord"','id="nNtfy"','id="testNotify"'))
          assert all(new in html for new in ('id="nSoundMode"','id="nSoundFile"','id="previewSound"','id="settingsNotifyPermission"'))
          assert 'uploadNotificationSoundIfNeeded' in js
          assert 'playCompletionSound' in app_js
          assert 'function beep()' not in app_js
          assert sound.exists() and sound.read_bytes().startswith(b'RIFF') and sound.stat().st_size > 1000
          assert 'update-manifest.json' not in html

          leftovers = list(pathlib.Path('release_tools').glob('cleanup.part*'))
          assert not leftovers, f'Temporary cleanup files remain: {leftovers}'
          assert not pathlib.Path('release_tools/update-manifest.example.json').exists()
          PY

      - name: Commit Applied Feature Update
        id: source
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply pending feature update"
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine Version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          text=open('dashboard.py', encoding='utf-8').read()
          print(re.search(r'^VERSION\s*=\s*["\']([^"\']+)', text, re.M).group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Replace Existing Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          for old_tag in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.prerelease == true) | .tag_name'); do
            gh release delete "$old_tag" --cleanup-tag --yes >/dev/null 2>&1 || true
          done
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true

      - name: Build Release Package
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          python release_tools/build_release.py --repo "$REPO" --tag "$TAG" --output dist
          ZIP="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.zip"
          test -f "$ZIP"
          python - <<'PY'
          import zipfile
          from pathlib import Path
          version='${{ steps.version.outputs.version }}'
          path=Path('dist') / f'Torrent-Dashboard-{version}.zip'
          with zipfile.ZipFile(path) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
          assert not any('cleanup.part' in n for n in names)
          assert not any(n.endswith('update-manifest.json') or n.endswith('update-manifest.example.json') for n in names)
          assert not any(n.endswith('apply_feature_update.py') for n in names)
          assert any(n.endswith('/dashboard.py') for n in names)
          assert any(n.endswith('/static/index.html') for n in names)
          assert any(n.endswith('/static/settings.js') for n in names)
          assert any(n.endswith('/static/settings.css') for n in names)
          assert any(n.endswith('/static/default-completion.wav') for n in names)
          PY

      - name: Publish GitHub Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        shell: bash
        run: |
          ZIP="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.zip"
          gh release create "$TAG" \
            "$ZIP" \
            --target "$RELEASE_SHA" \
            --title "Torrent Dashboard Pre-Release" \
            --notes "Development prerelease. Version: $TAG" \
            --prerelease
