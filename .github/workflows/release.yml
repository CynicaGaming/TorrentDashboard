name: Release Torrent Desk

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrent-desk-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply Pending Prerelease Cleanup
        shell: bash
        run: |
          if [ -f release_tools/apply_cleanup.py.gz.b64 ]; then
            base64 -d release_tools/apply_cleanup.py.gz.b64 | gzip -d > release_tools/apply_cleanup.py
            python release_tools/apply_cleanup.py
            rm -f release_tools/apply_cleanup.py release_tools/apply_cleanup.py.gz.b64
          fi

      - name: Validate Source
        shell: bash
        run: |
          python -m py_compile dashboard.py updater.py
          node --check static/app.js

      - name: Commit Cleanup
        id: source
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply Torrent Desk 3.4.0 prerelease cleanup"
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine Version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY2'
          import re
          text=open('dashboard.py', encoding='utf-8').read()
          print(re.search(r'^VERSION\s*=\s*["\']([^"\']+)', text, re.M).group(1))
          PY2
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Replace Existing Development Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true

      - name: Build Release Assets
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: python release_tools/build_release.py --repo "$REPO" --tag "$TAG" --output dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: |
          gh release create "$TAG" \
            dist/Torrent-Desk-*.zip \
            dist/Torrent-Desk-*.zip.sha256 \
            dist/update-manifest.json \
            --target "$RELEASE_SHA" \
            --title "Torrent Desk $TAG" \
            --generate-notes \
            --prerelease
