name: Torrent Dashboard Pre-Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrent-dashboard-prerelease
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate Source
        shell: bash
        run: |
          python -m py_compile dashboard.py updater.py release_tools/build_release.py
          node --check static/app.js
          python - <<'PY'
          import pathlib
          import dashboard

          assert dashboard.VERSION.startswith('0.')
          assert callable(dashboard.normalize_qbittorrent_server)
          sample = dashboard.normalize_qbittorrent_server({
              'base_url': 'http://127.0.0.1:8080',
              'auth_method': 'api_key',
              'api_key': 'qbt_' + ('A' * 28),
              'name': 'Desktop',
          })
          assert sample['name'] == 'Desktop'

          html = pathlib.Path('static/index.html').read_text(encoding='utf-8')
          assert 'Local IP Address' in html
          assert 'API Key (qBitTorrent 5.2+)' in html
          assert 'update-manifest.json' not in html

          leftovers = list(pathlib.Path('release_tools').glob('cleanup.part*'))
          assert not leftovers, f'Temporary cleanup files remain: {leftovers}'
          assert not pathlib.Path('release_tools/update-manifest.example.json').exists()
          PY

      - name: Determine Version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          text=open('dashboard.py', encoding='utf-8').read()
          print(re.search(r'^VERSION\s*=\s*["\']([^"\']+)', text, re.M).group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Replace Existing Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          for old_tag in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.prerelease == true) | .tag_name'); do
            gh release delete "$old_tag" --cleanup-tag --yes >/dev/null 2>&1 || true
          done
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true

      - name: Build Release Package
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          python release_tools/build_release.py --repo "$REPO" --tag "$TAG" --output dist
          ZIP="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.zip"
          test -f "$ZIP"
          python - <<'PY'
          import zipfile
          from pathlib import Path
          version='${{ steps.version.outputs.version }}'
          path=Path('dist') / f'Torrent-Dashboard-{version}.zip'
          with zipfile.ZipFile(path) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
          assert not any('cleanup.part' in n for n in names)
          assert not any(n.endswith('update-manifest.json') or n.endswith('update-manifest.example.json') for n in names)
          assert any(n.endswith('/dashboard.py') for n in names)
          assert any(n.endswith('/static/index.html') for n in names)
          PY

      - name: Publish GitHub Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          ZIP="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.zip"
          gh release create "$TAG" \
            "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "Torrent Dashboard Pre-Release" \
            --notes "Development prerelease. Version: $TAG" \
            --prerelease
