name: Torrent Dashboard Bootstrap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrent-dashboard-prerelease
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply Validated Source Bundle
        shell: bash
        run: |
          set -euo pipefail
          test -d release_tools/stage
          shopt -s nullglob
          parts=(release_tools/stage/payload.part*)
          test ${#parts[@]} -eq 15
          cat "${parts[@]}" | base64 -d > /tmp/torrent-dashboard-0.4.0.tar.gz
          echo "301e86aa2d73cf6c982e125cf5da2e80e58605a841d85e918b9dba284a26d914  /tmp/torrent-dashboard-0.4.0.tar.gz" | sha256sum -c -
          tar -xzf /tmp/torrent-dashboard-0.4.0.tar.gz -C .
          rm -rf release_tools/stage
          rm -f release_tools/cleanup.part* release_tools/apply_cleanup.py release_tools/apply_cleanup.py.gz.b64 release_tools/update-manifest.example.json

          python -m py_compile dashboard.py updater.py release_tools/build_release.py
          node --check static/app.js
          python - <<'PY'
          import pathlib
          import dashboard

          assert dashboard.VERSION == '0.4.0'
          assert callable(dashboard.normalize_qbittorrent_server)
          sample = dashboard.normalize_qbittorrent_server({
              'base_url': 'http://127.0.0.1:8080',
              'auth_method': 'api_key',
              'api_key': 'qbt_' + ('A' * 28),
              'name': 'Desktop',
          })
          assert sample['name'] == 'Desktop'

          html = pathlib.Path('static/index.html').read_text(encoding='utf-8')
          assert 'Local IP Address' in html
          assert 'API Key (qBitTorrent 5.2+)' in html
          assert not list(pathlib.Path('release_tools').glob('cleanup.part*'))
          assert not pathlib.Path('release_tools/update-manifest.example.json').exists()
          PY

      - name: Commit Clean Source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize Torrent Dashboard 0.4.0 prerelease"
          git push origin HEAD:main
