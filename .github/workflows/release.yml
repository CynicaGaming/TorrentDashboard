name: Release Torrent Desk

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrent-desk-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY2'
          import re
          text=open('dashboard.py', encoding='utf-8').read()
          print(re.search(r'^VERSION\s*=\s*["\']([^"\']+)', text, re.M).group(1))
          PY2
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Existing Release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release Assets
        if: steps.existing.outputs.exists != 'true'
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: python release_tools/build_release.py --repo "$REPO" --tag "$TAG" --output dist

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/Torrent-Desk-*.zip \
            dist/Torrent-Desk-*.zip.sha256 \
            dist/update-manifest.json \
            --target "$GITHUB_SHA" \
            --title "Torrent Desk $TAG" \
            --generate-notes
