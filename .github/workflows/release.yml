name: Torrent Dashboard Pre-Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrent-dashboard-prerelease
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate Source
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          node - <<'JS'
          global.window = {};
          const fs = require('fs');
          eval(fs.readFileSync('static/settings.js','utf8'));
          if (!window.TDSettings || typeof window.TDSettings.bind !== 'function' || typeof window.TDSettings.fill !== 'function') {
            throw new Error('settings.js did not initialize window.TDSettings');
          }
          JS

      - name: Determine Version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          text=open('src/torrent_dashboard/__init__.py', encoding='utf-8').read()
          print(re.search(r'^__version__\s*=\s*["\']([^"\']+)', text, re.M).group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        shell: bash
        run: |
          python release_tools/generate_release_notes.py \
            --version "${{ steps.version.outputs.version }}" \
            --release-body dist/release-notes.md \
            --check

      - name: Build Release Package
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          python release_tools/build_release.py --repo "$REPO" --tag "$TAG" --output dist
          ZIP="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.zip"
          INFO="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.release.json"
          test -f "$ZIP"
          test -f "$INFO"
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path
          version='${{ steps.version.outputs.version }}'
          prefix=f'Torrent-Dashboard-{version}'
          path=Path('dist') / f'Torrent-Dashboard-{version}.zip'
          info_path=Path('dist') / f'Torrent-Dashboard-{version}.release.json'
          with zipfile.ZipFile(path) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
              required=(
                  '/src/torrent_dashboard/__init__.py','/src/torrent_dashboard/dashboard.py',
                  '/src/torrent_dashboard/updater.py','/src/torrent_dashboard/recovery_tool.py',
                  '/src/torrent_dashboard/users.py','/src/torrent_dashboard/config_store.py',
                  '/src/torrent_dashboard/config.py','/src/torrent_dashboard/integrations.py',
                  '/src/torrent_dashboard/jellyfin.py','/src/torrent_dashboard/release_provenance.py',
                  '/pyproject.toml','/ARCHITECTURE.md','/PROJECT_STATE.md','/CHANGELOG.md',
                  '/release_notes/releases.json','/static/index.html','/static/app.js',
                  '/static/settings.js','/static/settings.css',
              )
              for suffix in required:
                  assert any(n.endswith(suffix) for n in names), suffix

              # 0.5.146 is the bridge into the canonical src layout. Older
              # update staging validates dashboard.py at the extracted root,
              # so the release ZIP carries tiny launchers that immediately
              # delegate to src/torrent_dashboard. Maintained repository source
              # remains src-only.
              compatibility=('dashboard.py','updater.py','recovery_tool.py')
              for name in compatibility:
                  member=f'{prefix}/{name}'
                  assert member in names, member
                  source=z.read(member).decode('utf-8')
                  compile(source, member, 'exec')
                  assert 'maintained code lives under src/' in source
              assert f'VERSION = "{version}"' in z.read(f'{prefix}/dashboard.py').decode('utf-8')
              assert 'from torrent_dashboard.dashboard import main' in z.read(f'{prefix}/dashboard.py').decode('utf-8')

              # Emulate the legacy safe_extract_zip application check that
              # produced "Update ZIP does not contain a valid Torrent Dashboard application".
              top={name.split('/',1)[0] for name in names}
              assert top == {prefix}, top
              assert f'{prefix}/dashboard.py' in names
              assert f'{prefix}/static/index.html' in names

              retired=(
                  '/torrent_dashboard/__init__.py','/torrent_dashboard/config.py',
                  '/torrent_dashboard/dashboard.py','/torrent_dashboard/updater.py',
              )
              for suffix in retired:
                  assert f'{prefix}{suffix}' not in names, suffix
              assert not any(n.endswith('recover_v0_5_123.py') or n.endswith('run_recovery_safe.py') for n in names)

              package_info=json.loads(z.read(f'{prefix}/package-info.json'))
              assert package_info['distribution'] == 'source'
              assert package_info['layout'] == 'src'
              assert package_info['compatibility_launchers'] == sorted(compatibility)

          info=json.loads(info_path.read_text(encoding='utf-8'))
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          assert info['version'] == version
          assert info['package'] == path.name
          assert info['sha256'] == digest
          assert info['distribution'] == 'source'
          assert info['layout'] == 'src'
          PY

      - name: Publish Or Refresh GitHub Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.zip"
          INFO="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.release.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$INFO" --clobber
            gh release edit "$TAG" \
              --title "Torrent Dashboard $TAG Pre-Release" \
              --notes-file dist/release-notes.md \
              --prerelease
          else
            gh release create "$TAG" \
              "$ZIP" "$INFO" \
              --target "$GITHUB_SHA" \
              --title "Torrent Dashboard $TAG Pre-Release" \
              --notes-file dist/release-notes.md \
              --prerelease
          fi

      - name: Remove Superseded Pre-Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for old_tag in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.prerelease == true) | .tag_name'); do
            if [ "$old_tag" != "$TAG" ]; then
              gh release delete "$old_tag" --cleanup-tag --yes
            fi
          done

      - name: Verify Updater-Visible Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '
            select(.draft == false)
            | select(.prerelease == true)
            | select(.tag_name == env.TAG)
            | .assets[]
            | select(.name == "Torrent-Dashboard-${{ steps.version.outputs.version }}.zip")
            | select(.digest | startswith("sha256:"))
            | .id
          ' | grep -Eq '^[0-9]+$'
