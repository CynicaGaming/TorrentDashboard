name: Torrent Dashboard Pre-Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrent-dashboard-prerelease
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply Pending Feature Update
        shell: bash
        run: |
          if [ -f release_tools/apply_feature_update.py ]; then
            python release_tools/apply_feature_update.py
            rm -f release_tools/apply_feature_update.py
          fi

      - name: Validate Source
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          node --check static/app.js
          node --check static/settings.js
          node - <<'JS'
          global.window = {};
          const fs = require('fs');
          eval(fs.readFileSync('static/settings.js','utf8'));
          if (!window.TDSettings || typeof window.TDSettings.bind !== 'function' || typeof window.TDSettings.fill !== 'function') {
            throw new Error('settings.js did not initialize window.TDSettings');
          }
          JS

      - name: Commit Applied Feature Update
        id: source
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply pending feature update"
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine Version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          text=open('dashboard.py', encoding='utf-8').read()
          print(re.search(r'^VERSION\s*=\s*["\']([^"\']+)', text, re.M).group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        shell: bash
        run: |
          python release_tools/generate_release_notes.py \
            --version "${{ steps.version.outputs.version }}" \
            --release-body dist/release-notes.md \
            --check

      - name: Replace Existing Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true

      - name: Build Release Package
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          python release_tools/build_release.py --repo "$REPO" --tag "$TAG" --output dist
          ZIP="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.zip"
          INFO="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.release.json"
          test -f "$ZIP"
          test -f "$INFO"
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          version='${{ steps.version.outputs.version }}'
          path=Path('dist') / f'Torrent-Dashboard-{version}.zip'
          info_path=Path('dist') / f'Torrent-Dashboard-{version}.release.json'
          with zipfile.ZipFile(path) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
          required=(
              '/dashboard.py',
              '/updater.py',
              '/torrent_dashboard/__init__.py',
              '/torrent_dashboard/users.py',
              '/torrent_dashboard/config_store.py',
              '/torrent_dashboard/config.py',
              '/torrent_dashboard/integrations.py',
              '/ARCHITECTURE.md',
              '/PROJECT_STATE.md',
              '/CHANGELOG.md',
              '/release_notes/releases.json',
              '/static/index.html',
              '/static/app.js',
              '/static/settings.js',
          )
          for suffix in required:
              assert any(n.endswith(suffix) for n in names), suffix
          assert not any(n.endswith('apply_feature_update.py') for n in names)
          assert not any('cleanup.part' in n for n in names)
          info=json.loads(info_path.read_text(encoding='utf-8'))
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          assert info['version'] == version
          assert info['package'] == path.name
          assert info['sha256'] == digest
          PY

      - name: Publish GitHub Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        shell: bash
        run: |
          ZIP="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.zip"
          INFO="dist/Torrent-Dashboard-${{ steps.version.outputs.version }}.release.json"
          gh release create "$TAG" \
            "$ZIP" "$INFO" \
            --target "$RELEASE_SHA" \
            --title "Torrent Dashboard $TAG Pre-Release" \
            --notes-file dist/release-notes.md \
            --prerelease
