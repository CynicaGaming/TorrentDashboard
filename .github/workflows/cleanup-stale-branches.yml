name: Final repository cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-stale-branches.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every non-main branch
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            "prerelease/backend-modularization" \
            "refactor/backend-modularization-users"
          do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              git push origin --delete "${branch}"
            fi
          done

      - name: Close any remaining open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for number in $(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].number'); do
            echo "Closing PR #${number}"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${number}" -f state=closed >/dev/null
          done

      - name: Wait for maintenance-triggered prerelease run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/release.yml") | .status' | head -n 1 || true)
            if [ "${status}" = "completed" ]; then
              echo "Prerelease workflow completed"
              exit 0
            fi
            sleep 3
          done
          echo "No completed prerelease run observed; continuing cleanup"

      - name: Remove prerelease releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.prerelease == true) | .tag_name'); do
            echo "Deleting prerelease ${tag}"
            gh release delete "${tag}" --cleanup-tag --yes
          done

      - name: Remove this temporary cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-stale-branches.yml
          git commit -m "Remove temporary repository cleanup workflow"
          git push origin HEAD:main
