name: Apply notification sound polish

on:
  push:
    branches:
      - feature/notification-sound-polish

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply notification sound changes
        run: |
          python release_tools/apply_notification_sound_polish.py
          python release_tools/generate_release_notes.py --version 0.5.126
      - name: Validate
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          node --check static/app.js
          node --check static/settings.js
          test -f static/notification-default.wav
          test ! -e static/default-completion.wav
          grep -q "media-src 'self' blob:" dashboard.py
          grep -q "notification-custom" dashboard.py
          grep -q "notification-default.wav" static/app.js
          grep -q "notification-default.wav" static/settings.js
          grep -q 'id="nSoundDrop"' static/index.html
          grep -q 'id="nSoundVolume"' static/index.html
          ! grep -q "Custom sounds are stored in the data directory" static/index.html
      - name: Commit validated source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm release_tools/apply_notification_sound_polish.py
          rm .github/workflows/apply-notification-sound-polish.yml
          git add -A
          git commit -m 'Polish notification sound controls'
          git push origin HEAD:${GITHUB_REF_NAME}
