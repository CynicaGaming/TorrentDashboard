name: Prepare System Navigation Hotfix

on:
  push:
    branches:
      - hotfix/system-settings-navigation

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: hotfix/system-settings-navigation
          fetch-depth: 0
          persist-credentials: true

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check .

      - name: Apply hotfix and prepare v0.5.156
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          settings = root / 'static' / 'settings.js'
          text = settings.read_text(encoding='utf-8')
          old = "const allowed = ['general','access','clients','backups','updates','notifications','integrations','users'];"
          new = "const allowed = ['general','access','clients','backups','updates','notifications','integrations','users','system'];"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not locate settings-page allowlist')
          settings.write_text(text, encoding='utf-8')

          tests = root / 'tests' / 'test_system_ops_ui.py'
          source = tests.read_text(encoding='utf-8')
          marker = '    def test_runtime_injects_ops_script_into_application_shell(self):\n'
          addition = '''    def test_main_settings_controller_accepts_system_page(self):\n        source = (ROOT / "static" / "settings.js").read_text(encoding="utf-8")\n        self.assertIn("'users','system']", source)\n        self.assertIn("activate(btn.dataset.settingsPage)", source)\n\n'''
          if 'test_main_settings_controller_accepts_system_page' not in source:
              if marker not in source:
                  raise SystemExit('Could not locate System UI test insertion point')
              source = source.replace(marker, addition + marker, 1)
          tests.write_text(source, encoding='utf-8')

          init = root / 'src' / 'torrent_dashboard' / '__init__.py'
          init_text = init.read_text(encoding='utf-8').replace('__version__ = "0.5.155"', '__version__ = "0.5.156"')
          if '__version__ = "0.5.156"' not in init_text:
              raise SystemExit('Version bump failed')
          init.write_text(init_text, encoding='utf-8')

          for path in [root / 'static' / 'index.html', root / 'static' / 'app.js']:
              value = path.read_text(encoding='utf-8').replace('0.5.155', '0.5.156')
              path.write_text(value, encoding='utf-8')

          sw = root / 'static' / 'sw.js'
          value = sw.read_text(encoding='utf-8').replace('torrent-dashboard-v05155', 'torrent-dashboard-v05156').replace('0.5.155', '0.5.156')
          sw.write_text(value, encoding='utf-8')

          catalog_path = root / 'release_notes' / 'releases.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          if not any(str(item.get('version')) == '0.5.156' for item in catalog['releases']):
              catalog['releases'].insert(0, {
                  'version': '0.5.156',
                  'date': '2026-09-11',
                  'status': 'prerelease',
                  'title': 'System settings navigation hotfix',
                  'summary': 'Fixes the v0.5.155 System settings navigation so the new operational settings page opens normally from desktop and mobile settings navigation.',
                  'highlights': [
                      'Makes System a first-class settings page in the main settings controller.',
                      'Keeps the v0.5.155 System health, encrypted-backup, scheduling, automatic-update, audit, and retention controls accessible through the normal settings navigation.'
                  ],
                  'fixes': [
                      'Prevents the main settings router from immediately falling back to General after the System page is activated.',
                      'Adds a regression contract covering the shared settings-page allowlist so this integration failure is caught before release.'
                  ],
                  'technical': [
                      'Extends TDSettings.activate() to recognize the dynamically registered system page while leaving the existing System module and administrator authorization model unchanged.'
                  ],
                  'validation': [
                      'Runs source/unit validation, browser contract checks, JavaScript syntax checks, generated documentation validation, the real source updater package build, and the Windows PyInstaller smoke build.'
                  ],
                  'known_issues': [
                      'Backup encryption remains opt-in; unencrypted portable backups can contain saved client and integration credentials and should be stored securely.',
                      'Windows executables are not code-signed yet.'
                  ],
                  'architecture': [
                      'System remains an operations extension layered around the existing settings controller rather than duplicating the complete settings router.'
                  ],
                  'decisions': [
                      'Register extension settings pages with the shared settings router instead of allowing competing navigation state machines.'
                  ],
                  'next_steps': [
                      {'priority': 1, 'title': 'Verify System navigation after auto-update', 'detail': 'Confirm an existing v0.5.155 installation detects v0.5.156 and that System opens from desktop and mobile Settings after the update.'}
                  ]
              })
          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          current = {
              'schema': 1,
              'status': 'release-candidate',
              'objective': 'Publish the v0.5.156 System settings navigation hotfix',
              'why': 'v0.5.155 shipped the System operations page, but the shared settings router rejects the system page identifier and falls back to General when System is clicked.',
              'acceptance_criteria': [
                  'The shared settings controller accepts system as a valid settings page.',
                  'The System UI contract explicitly checks the shared router integration.',
                  'Ubuntu/Windows Python 3.13/3.14 validation passes.',
                  'The source updater ZIP and compiled Windows package build successfully, and all three Windows executables pass smoke tests.',
                  'v0.5.156 is published with both source and Windows updater ZIPs and SHA-256 digests.'
              ],
              'decisions': [
                  'Fix the shared settings router rather than adding another independent navigation workaround.',
                  'Ship the correction as v0.5.156 so existing installations can receive it through auto-update.'
              ],
              'files': [
                  'static/settings.js',
                  'tests/test_system_ops_ui.py',
                  'src/torrent_dashboard/__init__.py',
                  'static/index.html',
                  'static/app.js',
                  'static/sw.js',
                  'release_notes/releases.json'
              ],
              'blockers': [],
              'out_of_scope': ['No changes to System feature behavior, permissions, backup policy, audit storage, or update scheduling beyond the navigation defect.'],
              'next_action': 'Run the full pull-request validation and Windows smoke build; if green, merge and verify the updater-visible v0.5.156 release.'
          }
          (root / 'development' / 'current.json').write_text(json.dumps(current, indent=2) + '\n', encoding='utf-8')
          PY

          python release_tools/generate_release_notes.py --version 0.5.156

      - name: Validate hotfix
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          node --check static/ops.js

      - name: Commit prepared hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/settings.js tests/test_system_ops_ui.py src/torrent_dashboard/__init__.py static/index.html static/app.js static/sw.js release_notes/releases.json development/current.json CHANGELOG.md PROJECT_STATE.md HANDOFF.md
          git diff --cached --check
          git commit -m 'Release v0.5.156 — Fix System settings navigation'
          git push origin HEAD:hotfix/system-settings-navigation
