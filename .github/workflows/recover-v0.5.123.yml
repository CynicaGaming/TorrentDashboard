name: Recover v0.5.123 Release Line

on:
  push:
    branches:
      - recovery/v0.5.123

permissions:
  contents: write

concurrency:
  group: torrent-dashboard-recovery-v0-5-123
  cancel-in-progress: false

jobs:
  recover-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovered v0.5.122 baseline
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply recovery and v0.5.123 feature
        run: python release_tools/run_recovery_safe.py

      - name: Validate recovered source
        shell: bash
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          node - <<'JS'
          global.window = {};
          const fs = require('fs');
          eval(fs.readFileSync('static/settings.js','utf8'));
          if (!window.TDSettings || typeof window.TDSettings.bind !== 'function' || typeof window.TDSettings.fill !== 'function') {
            throw new Error('settings.js did not initialize window.TDSettings');
          }
          JS
          python release_tools/generate_release_notes.py --version 0.5.123 --release-body dist/release-notes.md --check

      - name: Commit exact validated tree
        id: source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover release line as v0.5.123"
          git push origin HEAD:recovery/v0.5.123
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build recovered release package
        env:
          REPO: ${{ github.repository }}
          TAG: v0.5.123
        shell: bash
        run: |
          python release_tools/build_release.py --repo "$REPO" --tag "$TAG" --output dist
          test -f dist/Torrent-Dashboard-0.5.123.zip
          test -f dist/Torrent-Dashboard-0.5.123.release.json

      - name: Publish recovered pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/Torrent-Dashboard-0.5.123.zip"
          INFO="dist/Torrent-Dashboard-0.5.123.release.json"
          if gh release view v0.5.123 >/dev/null 2>&1; then
            gh release upload v0.5.123 "$ZIP" "$INFO" --clobber
            gh release edit v0.5.123 --target "$RELEASE_SHA" --title "Torrent Dashboard v0.5.123 Pre-Release" --notes-file dist/release-notes.md --prerelease
          else
            gh release create v0.5.123 "$ZIP" "$INFO" --target "$RELEASE_SHA" --title "Torrent Dashboard v0.5.123 Pre-Release" --notes-file dist/release-notes.md --prerelease
          fi

      - name: Verify updater-visible recovered pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/v0.5.123" --jq '
            select(.draft == false)
            | select(.prerelease == true)
            | .assets[]
            | select(.name == "Torrent-Dashboard-0.5.123.zip")
            | select(.digest | startswith("sha256:"))
            | .id
          ' | grep -Eq '^[0-9]+$'
