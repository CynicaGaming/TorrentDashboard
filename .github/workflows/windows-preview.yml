name: Windows Executable Preview

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrent-dashboard-windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-preview:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path "src/torrent_dashboard/__init__.py" -Pattern '^__version__\s*=\s*"([^"]+)"'
          if (-not $match) { throw "Could not determine __version__ from src/torrent_dashboard/__init__.py" }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Install build and runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check . "pyinstaller==6.22.2"

      - name: Build Windows Preview Package
        shell: pwsh
        run: |
          python release_tools/build_windows.py --repo "${{ github.repository }}" --tag "${{ steps.version.outputs.tag }}" --output dist-windows

      - name: Smoke Test Executables
        shell: pwsh
        run: |
          $pkg = "dist-windows\TorrentDashboard-Windows-${{ steps.version.outputs.version }}-x64"
          & "$pkg\Dashboard.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Dashboard.exe --help failed" }
          & "$pkg\Recovery.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Recovery.exe --help failed" }
          & "$pkg\Updater.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Updater.exe --help failed" }
          foreach ($name in @("Dashboard.exe","Recovery.exe","Updater.exe","static\index.html","package-info.json")) {
            if (-not (Test-Path "$pkg\$name")) { throw "Missing $name" }
          }
          $info = Get-Content "$pkg\package-info.json" | ConvertFrom-Json
          if ($info.distribution -ne 'windows-x64') { throw "Wrong distribution" }
          if ($info.layout -ne 'windows-bundle-v1') { throw "Wrong Windows package layout" }

      - name: Wait For Source Pre-Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $found = $false
          for ($i = 0; $i -lt 60; $i++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) { $found = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $found) { throw "Source prerelease $tag was not created in time" }

      - name: Publish Windows Preview Assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = "dist-windows\TorrentDashboard-Windows-${{ steps.version.outputs.version }}-x64.zip"
          $info = "dist-windows\TorrentDashboard-Windows-${{ steps.version.outputs.version }}-x64.release.json"
          gh release upload "${{ steps.version.outputs.tag }}" $zip $info --clobber

      - name: Verify Complete Auto-Update Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $source = gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.assets[] | select(.name == "Torrent-Dashboard-${{ steps.version.outputs.version }}.zip") | select(.digest | startswith("sha256:")) | .id'
          $windows = gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.assets[] | select(.name == "TorrentDashboard-Windows-${{ steps.version.outputs.version }}-x64.zip") | select(.digest | startswith("sha256:")) | .id'
          if ($source -notmatch '^[0-9]+$') { throw "Source release asset is missing or lacks a SHA-256 digest" }
          if ($windows -notmatch '^[0-9]+$') { throw "Windows release asset is missing or lacks a SHA-256 digest" }

      - name: Remove Superseded Pre-Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $oldTags = gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.prerelease == true) | .tag_name'
          foreach ($oldTag in $oldTags) {
            if ($oldTag -and $oldTag -ne $tag) {
              gh release delete $oldTag --cleanup-tag --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not remove superseded prerelease $oldTag" }
            }
          }
