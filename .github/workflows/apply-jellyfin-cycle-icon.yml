name: Apply Jellyfin cycle icon

on:
  push:
    branches:
      - feature/jellyfin-cycle-icon

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply cycle icon update
        run: python release_tools/apply_jellyfin_cycle_icon.py

      - name: Validate
        run: |
          python release_tools/validate_source.py
          python release_tools/validate_ui_strings.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check static/app.js
          node --check static/settings.js
          python release_tools/generate_release_notes.py --version 0.5.131 --check
          grep -q "cycle:'M12 6v3l4-4-4-4v3" static/settings.js
          test "$(grep -o "jellyfinTaskIcon('cycle')" static/settings.js | wc -l)" -eq 2
          ! grep -q "jellyfinTaskIcon('refresh')" static/settings.js

      - name: Commit validated source
        shell: bash
        run: |
          rm -f release_tools/apply_jellyfin_cycle_icon.py .github/workflows/apply-jellyfin-cycle-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Use cycle glyph for Jellyfin refresh controls'
          git push
