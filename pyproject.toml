[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "torrent-dashboard"
dynamic = ["version"]
description = "Self-hosted qBitTorrent dashboard for desktop and mobile browsers"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{name = "CynicaGaming"}]
dependencies = []

[project.scripts]
torrent-dashboard = "torrent_dashboard.runtime:main"
torrent-dashboard-recovery = "torrent_dashboard.recovery_tool:main"
torrent-dashboard-updater = "torrent_dashboard.updater:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "torrent_dashboard.__version__"}
